<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
	<!--
		Drawn on a 32-unit grid so it stays legible at the 16 px tab size: the
		robot fills the tile, and the strokes and features are at least one
		device pixel wide at 16 px.
	-->
	<defs>
		<linearGradient id="dline-favicon-tile" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#5CC8B8" />
			<stop offset="1" stop-color="#1F7A6F" />
		</linearGradient>
		<mask id="dline-favicon-face" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
			<rect width="32" height="32" fill="#FFFFFF" />
			<g fill="#000000">
				<circle cx="11.8" cy="18.2" r="2.7" />
				<circle cx="20.2" cy="18.2" r="2.7" />
				<rect x="12.4" y="23.1" width="7.2" height="2.5" rx="1.25" />
			</g>
		</mask>
	</defs>
	<rect width="32" height="32" rx="7" fill="url(#dline-favicon-tile)" />
	<g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
		<path d="M16 11V7.6M16 7.6 12.4 4.6M16 7.6 19.6 4.6" stroke-width="2.3" />
		<path d="M3.9 15.3 1.9 18.6 3.9 21.9" stroke-width="2.2" />
		<path d="M28.1 15.3 30.1 18.6 28.1 21.9" stroke-width="2.2" />
	</g>
	<rect x="5.4" y="10.6" width="21.2" height="17.4" rx="5.4" fill="#FFFFFF" mask="url(#dline-favicon-face)" />
</svg>
