    required_result: passed
    claim: "classification matrix makes actual undeclared and unfinished implementation warnings while completed expectation or record contradictions block"
  VER-TASK-11403-GRAPH:
    required_result: passed
    claim: "canonical Unicode identity arbitrary-length SCC and owned-node nonzero Depends On detect cycles ambiguity and zero-hop false dependencies"
  VER-TASK-11403-BINDING:
    required_result: passed
    claim: "direct import injected port composition event callback and RPC adapters prove both sides without false dependency-inversion failures"
  VER-TASK-11403-OWNERSHIP:
    required_result: passed
    claim: "owns remains write permission while explicit authority claims and computable boundary lattice detect completed conflicts and warn on unknown selectors"
