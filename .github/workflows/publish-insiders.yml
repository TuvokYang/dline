name: Publish Insiders

on:
  workflow_run:
    workflows:
      # Must match the display name in .github/workflows/test.yml.
      - Tests
    types:
      - completed

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: publish-insiders
  cancel-in-progress: false

jobs:
  verify-insiders:
    name: Verify tested Insiders VSIX
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      eligible: ${{ steps.trigger.outputs.eligible }}
      commit_sha: ${{ steps.trigger.outputs.commit_sha }}
      release_tag: ${{ steps.trigger.outputs.release_tag }}
      asset_name: ${{ steps.vsix.outputs.asset_name }}
      version: ${{ steps.vsix.outputs.version }}
      sha256: ${{ steps.vsix.outputs.sha256 }}
    steps:
      - name: Verify triggering workflow and current dev head
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
        shell: bash
        run: |
          set -euo pipefail
          echo "eligible=false" >> "$GITHUB_OUTPUT"

          if [[ "$SOURCE_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "Error: refusing a Tests run from '$SOURCE_REPOSITORY'."
            exit 1
          fi
          if [[ "$SOURCE_WORKFLOW_PATH" != ".github/workflows/test.yml" ]]; then
            echo "Error: unexpected source workflow path '$SOURCE_WORKFLOW_PATH'."
            exit 1
          fi

          current_dev_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq '.object.sha')
          if [[ "$TESTED_SHA" != "$current_dev_sha" ]]; then
            echo "::notice::Skipping superseded Insiders run '$TESTED_SHA'; current dev is '$current_dev_sha'."
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$TESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "release_tag=insiders-$TESTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Download tested VSIX artifact
        if: steps.trigger.outputs.eligible == 'true'
        uses: actions/download-artifact@v8
        with:
          name: dline-vsix-${{ github.event.workflow_run.head_sha }}
          path: tested-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify Insiders identity
        if: steps.trigger.outputs.eligible == 'true'
        id: vsix
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t assets < <(find tested-artifact -maxdepth 1 -type f -name '*.vsix' -print)
          if [[ "${#assets[@]}" -ne 1 ]]; then
            echo "Error: expected exactly one tested VSIX, found ${#assets[@]}"
            exit 1
          fi

          vsix_path="${assets[0]}"
          asset_name=$(basename "$vsix_path")
          manifest_path="$RUNNER_TEMP/vsix-package.json"
          unzip -p "$vsix_path" extension/package.json > "$manifest_path"
          if ! jq -e '
            .name == "dline-insiders" and
            .publisher == "tuvokyang" and
            (.preview == true) and
            (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))
          ' "$manifest_path" >/dev/null; then
            echo "Error: tested VSIX identity or version does not match the Insiders channel."
            jq '{name, publisher, version, preview}' "$manifest_path"
            exit 1
          fi

          version=$(jq -r '.version' "$manifest_path")
          sha256=$(sha256sum "$vsix_path" | cut -d' ' -f1)
          echo "$sha256  $vsix_path"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload verified registry package
        if: steps.trigger.outputs.eligible == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: registry-vsix-${{ github.event.workflow_run.head_sha }}
          path: tested-artifact/${{ steps.vsix.outputs.asset_name }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-draft:
    name: Publish per-commit Insiders draft
    needs: verify-insiders
    if: needs.verify-insiders.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified Insiders VSIX
        uses: actions/download-artifact@v8
        with:
          name: registry-vsix-${{ needs.verify-insiders.outputs.commit_sha }}
          path: release-artifact

      - name: Verify draft asset
        env:
          ASSET_NAME: ${{ needs.verify-insiders.outputs.asset_name }}
          EXPECTED_SHA256: ${{ needs.verify-insiders.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          vsix_path="release-artifact/$ASSET_NAME"
          if [[ ! -s "$vsix_path" ]]; then
            echo "Error: verified Insiders VSIX '$vsix_path' is missing or empty."
            exit 1
          fi
          actual_sha256=$(sha256sum "$vsix_path" | cut -d' ' -f1)
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "Error: Insiders draft asset changed after verification."
            exit 1
          fi

      - name: Create or update maintainers-only draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-insiders.outputs.release_tag }}
          COMMIT_SHA: ${{ needs.verify-insiders.outputs.commit_sha }}
          VERSION: ${{ needs.verify-insiders.outputs.version }}
          ASSET_NAME: ${{ needs.verify-insiders.outputs.asset_name }}
          SHA256: ${{ needs.verify-insiders.outputs.sha256 }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          vsix_path="release-artifact/$ASSET_NAME"
          notes_path="$RUNNER_TEMP/insiders-notes.md"
          cat > "$notes_path" <<EOF
          Automated Insiders build for dev commit \`$COMMIT_SHA\`.

          - Extension version: \`$VERSION\`
          - SHA-256: \`$SHA256\`
          - Validated Tests run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}
          EOF
          title="Dline Insiders ${COMMIT_SHA:0:12}"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --draft \
              --prerelease \
              --target "$COMMIT_SHA" \
              --title "$title" \
              --notes-file "$notes_path" \
              --repo "$GITHUB_REPOSITORY"
            gh release upload "$RELEASE_TAG" "$vsix_path" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$vsix_path" \
              --target "$COMMIT_SHA" \
              --draft \
              --prerelease \
              --title "$title" \
              --notes-file "$notes_path" \
              --repo "$GITHUB_REPOSITORY"
          fi

  publish-registries:
    name: Publish Insiders registries
    needs: verify-insiders
    if: needs.verify-insiders.outputs.eligible == 'true'
    uses: ./.github/workflows/publish-vsix-registries.yml
    with:
      artifact_name: registry-vsix-${{ github.event.workflow_run.head_sha }}
      asset_name: ${{ needs.verify-insiders.outputs.asset_name }}
      expected_sha256: ${{ needs.verify-insiders.outputs.sha256 }}
    secrets: inherit
