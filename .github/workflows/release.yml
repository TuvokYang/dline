name: Production Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: production-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify production release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify tag, version, and main ancestry
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: production tag must match vX.Y.Z"
            exit 1
          fi

          tag_version="${tag#v}"
          package_version=$(node -p "require('./package.json').version")
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Error: tag version '$tag_version' does not match package version '$package_version'"
            exit 1
          fi

          git fetch origin main --no-tags
          tag_sha=$(git rev-parse "${tag}^{commit}")
          if ! git merge-base --is-ancestor "$tag_sha" origin/main; then
            echo "Error: production tag '$tag' does not point to a commit on main"
            exit 1
          fi

  tests:
    name: Test and package release
    needs: verify-tag
    uses: ./.github/workflows/test.yml
    with:
      package_profile: release
    secrets:
      TELEMETRY_SERVICE_API_KEY: ${{ secrets.TELEMETRY_SERVICE_API_KEY }}
      ERROR_SERVICE_API_KEY: ${{ secrets.ERROR_SERVICE_API_KEY }}
      OTEL_TELEMETRY_ENABLED: ${{ secrets.OTEL_TELEMETRY_ENABLED }}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${{ secrets.OTEL_EXPORTER_OTLP_PROTOCOL }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

  release:
    name: Publish GitHub production release
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download tested VSIX
        uses: actions/download-artifact@v6
        with:
          name: dline-vsix-${{ github.sha }}
          path: release-artifact

      - name: Attest tested VSIX provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release-artifact/*.vsix

      - name: Create or update production release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --draft=false \
              --prerelease=false \
              --title "Dline ${TAG}" \
              --repo "$GITHUB_REPOSITORY"
            gh release upload "$TAG" release-artifact/*.vsix --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release-artifact/*.vsix \
              --verify-tag \
              --generate-notes \
              --title "Dline ${TAG}" \
              --repo "$GITHUB_REPOSITORY"
          fi
