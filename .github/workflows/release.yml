name: Publish Production

on:
  push:
    tags: ["v*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: read
  contents: read

concurrency:
  group: production-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-tests:
    name: Verify tagged Main Tests and retrieve tested packages
    runs-on: ubuntu-latest
    # Bound the wait above the unchanged source/package/work/functional critical-path limits.
    timeout-minutes: 310
    outputs:
      tag: ${{ steps.evidence.outputs.tag }}
      version: ${{ steps.evidence.outputs.version }}
      commit_sha: ${{ steps.evidence.outputs.commit_sha }}
      artifact_name: ${{ steps.evidence.outputs.artifact_name }}
      asset_name: ${{ steps.evidence.outputs.asset_name }}
      marketplace_artifact_name: ${{ steps.evidence.outputs.marketplace_artifact_name }}
      marketplace_asset_name: ${{ steps.evidence.outputs.marketplace_asset_name }}
      marketplace_sha256: ${{ steps.evidence.outputs.marketplace_sha256 }}
    steps:
      - name: Checkout publication verifier
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Wait for the exact tagged Main Tests run
        id: tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/production-gate.mjs wait
      - name: Download successful test evidence
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.tests.outputs.evidence_artifact }}
          path: test-evidence
          github-token: ${{ github.token }}
          run-id: ${{ steps.tests.outputs.tests_run_id }}
      - name: Verify test and package identities
        id: evidence
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          TESTS_RUN_ID: ${{ steps.tests.outputs.tests_run_id }}
          TESTS_RUN_ATTEMPT: ${{ steps.tests.outputs.tests_run_attempt }}
        run: node scripts/ci/production-gate.mjs verify test-evidence/production-tests.json
      - name: Download tested Open VSX package
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.evidence.outputs.artifact_name }}
          path: tested-open-vsx
          github-token: ${{ github.token }}
          run-id: ${{ steps.tests.outputs.tests_run_id }}
      - name: Download tested Marketplace package
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.evidence.outputs.marketplace_artifact_name }}
          path: tested-marketplace
          github-token: ${{ github.token }}
          run-id: ${{ steps.tests.outputs.tests_run_id }}
      - name: Verify original tested bytes before publication
        env:
          PUBLIC_ASSET: ${{ steps.evidence.outputs.asset_name }}
          PUBLIC_SHA256: ${{ steps.evidence.outputs.sha256 }}
          MARKETPLACE_ASSET: ${{ steps.evidence.outputs.marketplace_asset_name }}
          MARKETPLACE_SHA256: ${{ steps.evidence.outputs.marketplace_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          for registry in open-vsx marketplace; do
            directory="tested-$registry"
            asset="$PUBLIC_ASSET"
            expected="$PUBLIC_SHA256"
            if [[ "$registry" == 'marketplace' ]]; then
              asset="$MARKETPLACE_ASSET"
              expected="$MARKETPLACE_SHA256"
            fi
            mapfile -t files < <(find "$directory" -maxdepth 1 -type f -name '*.vsix' -print)
            if [[ "${#files[@]}" -ne 1 || "${files[0]}" != "$directory/$asset" ]]; then
              echo "Error: expected exactly the tested $registry VSIX"
              exit 1
            fi
            echo "$expected  $directory/$asset" | sha256sum --check --strict
          done
      # Transfer the same bytes to this publication run; never rebuild or rewrite a manifest.
      - name: Stage verified Open VSX package
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.evidence.outputs.artifact_name }}
          path: tested-open-vsx/${{ steps.evidence.outputs.asset_name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Stage verified Marketplace package
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.evidence.outputs.marketplace_artifact_name }}
          path: tested-marketplace/${{ steps.evidence.outputs.marketplace_asset_name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish the validated original packages
    needs: verify-tests
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-production-release.yml
    with:
      tag: ${{ needs.verify-tests.outputs.tag }}
      version: ${{ needs.verify-tests.outputs.version }}
      commit_sha: ${{ needs.verify-tests.outputs.commit_sha }}
      artifact_name: ${{ needs.verify-tests.outputs.artifact_name }}
      asset_name: ${{ needs.verify-tests.outputs.asset_name }}
      marketplace_artifact_name: ${{ needs.verify-tests.outputs.marketplace_artifact_name }}
      marketplace_asset_name: ${{ needs.verify-tests.outputs.marketplace_asset_name }}
      marketplace_expected_sha256: ${{ needs.verify-tests.outputs.marketplace_sha256 }}
    secrets: inherit
