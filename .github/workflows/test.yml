name: Tests

on:
  pull_request:
    branches: [dev]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [dev]
  workflow_call:
    inputs:
      package_profile:
        description: VSIX build profile.
        type: string
        required: false
        default: ci
      package_channel:
        description: VSIX identity channel; direct dev pushes use Insiders.
        type: string
        required: false
        default: auto
    outputs:
      marketplace_artifact_name:
        description: Tested Marketplace VSIX artifact.
        value: ${{ jobs.package-marketplace.outputs.artifact_name }}
      marketplace_asset_name:
        description: Marketplace VSIX filename.
        value: ${{ jobs.package-marketplace.outputs.asset_name }}
      marketplace_sha256:
        description: SHA-256 of the tested Marketplace VSIX.
        value: ${{ jobs.package-marketplace.outputs.sha256 }}
    secrets:
      OTEL_TELEMETRY_ENABLED:
        required: false
      OTEL_EXPORTER_OTLP_PROTOCOL:
        required: false
      OTEL_EXPORTER_OTLP_ENDPOINT:
        required: false
      OTEL_EXPORTER_OTLP_HEADERS:
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  policy:
    name: Resolve test execution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_tests: ${{ steps.policy.outputs.run_tests }}
    steps:
      - name: Checkout source and merge parents
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve content-preserving back-merge
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/workflow-policy.mjs test-gate

  checks:
    name: Checks
    needs: policy
    if: needs.policy.outputs.run_tests == 'true'
    uses: ./.github/workflows/checks.yml

  package:
    name: Package VSIX
    needs: checks
    uses: ./.github/workflows/package.yml
    with:
      profile: ${{ inputs.package_profile || 'ci' }}
      channel: ${{ inputs.package_channel && inputs.package_channel != 'auto' && inputs.package_channel || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && 'insiders' || 'ci') }}
    secrets:
      OTEL_EXPORTER_OTLP_PROTOCOL: ${{ inputs.package_profile == 'release' && secrets.OTEL_EXPORTER_OTLP_PROTOCOL || '' }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ inputs.package_profile == 'release' && secrets.OTEL_EXPORTER_OTLP_ENDPOINT || '' }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ inputs.package_profile == 'release' && secrets.OTEL_EXPORTER_OTLP_HEADERS || '' }}

  package-marketplace:
    name: Package Marketplace VSIX
    needs: checks
    uses: ./.github/workflows/package.yml
    with:
      profile: ${{ inputs.package_profile || 'ci' }}
      channel: ${{ inputs.package_channel && inputs.package_channel != 'auto' && inputs.package_channel || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && 'insiders' || 'ci') }}
      registry: vscode-marketplace
    secrets:
      OTEL_EXPORTER_OTLP_PROTOCOL: ${{ inputs.package_profile == 'release' && secrets.OTEL_EXPORTER_OTLP_PROTOCOL || '' }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ inputs.package_profile == 'release' && secrets.OTEL_EXPORTER_OTLP_ENDPOINT || '' }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ inputs.package_profile == 'release' && secrets.OTEL_EXPORTER_OTLP_HEADERS || '' }}

  e2e:
    name: E2E (Open VSX)
    needs: package
    uses: ./.github/workflows/e2e.yml
    with:
      artifact_name: ${{ needs.package.outputs.artifact_name }}
      commit_sha: ${{ needs.package.outputs.commit_sha }}

  e2e-marketplace:
    name: E2E (Marketplace)
    needs: package-marketplace
    uses: ./.github/workflows/e2e.yml
    with:
      artifact_name: ${{ needs.package-marketplace.outputs.artifact_name }}
      commit_sha: ${{ needs.package-marketplace.outputs.commit_sha }}
      registry: vscode-marketplace
