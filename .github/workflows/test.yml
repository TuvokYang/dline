name: Tests

on:
  pull_request:
    branches: [main, dev]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main, dev]
  workflow_call:
    inputs:
      package_profile:
        description: VSIX build profile.
        type: string
        required: false
        default: ci
    secrets:
      TELEMETRY_SERVICE_API_KEY:
        required: false
      ERROR_SERVICE_API_KEY:
        required: false
      OTEL_TELEMETRY_ENABLED:
        required: false
      OTEL_EXPORTER_OTLP_PROTOCOL:
        required: false
      OTEL_EXPORTER_OTLP_ENDPOINT:
        required: false
      OTEL_EXPORTER_OTLP_HEADERS:
        required: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      package_profile: ${{ steps.package-profile.outputs.value }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          install-webview: "true"

      - name: Check types
        run: npm run check-types

      - name: Resolve package profile
        id: package-profile
        shell: bash
        env:
          REQUESTED_PROFILE: ${{ inputs.package_profile }}
        run: |
          profile="${REQUESTED_PROFILE:-ci}"
          if [[ "$profile" != "ci" && "$profile" != "release" ]]; then
            echo "Error: package profile must be 'ci' or 'release'"
            exit 1
          fi
          echo "value=$profile" >> "$GITHUB_OUTPUT"

  biome:
    name: Biome
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Resolve Biome comparison base
        id: biome-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="origin/$BASE_REF"
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            base="$BEFORE_SHA"
          else
            base="HEAD^"
          fi

          if ! git rev-parse --verify "$base^{commit}" >/dev/null 2>&1; then
            echo "::warning::Biome comparison base $base is unavailable; checking from the current history root"
            base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi

          git rev-parse --verify "$base^{commit}"
          echo "value=$base" >> "$GITHUB_OUTPUT"

      - name: Check Biome formatting
        run: npm run format -- --since="${{ steps.biome-base.outputs.value }}"

      - name: Check Biome and protobuf lint rules
        run: npm run lint

  smoke:
    name: Smoke
    needs: biome
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Run smoke tests
        run: npm run test:smoke

  vitest:
    name: Vitest (${{ matrix.project }})
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: backend-task
            config: vitest.backend.config.ts
            install_webview: "false"
          - project: backend-prompts
            config: vitest.backend.config.ts
            install_webview: "false"
          - project: backend-hooks
            config: vitest.backend.config.ts
            install_webview: "false"
          - project: backend-core
            config: vitest.backend.config.ts
            install_webview: "false"
          - project: backend
            config: vitest.backend.config.ts
            install_webview: "false"
          - project: webview
            config: webview-ui/vitest.config.ts
            install_webview: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          install-webview: ${{ matrix.install_webview }}

      - name: Generate Protobuf code
        run: npm run protos

      - name: Run Vitest project
        env:
          VITEST_CONFIG: ${{ matrix.config }}
          VITEST_PROJECT: ${{ matrix.project }}
        run: npx vitest run --config "$VITEST_CONFIG" --project "$VITEST_PROJECT"

  e2e:
    name: E2E
    needs: vitest
    uses: ./.github/workflows/e2e.yml

  package:
    name: Package VSIX
    needs: [typecheck, e2e]
    uses: ./.github/workflows/package.yml
    with:
      profile: ${{ needs.typecheck.outputs.package_profile }}
    secrets:
      TELEMETRY_SERVICE_API_KEY: ${{ needs.typecheck.outputs.package_profile == 'release' && secrets.TELEMETRY_SERVICE_API_KEY || '' }}
      ERROR_SERVICE_API_KEY: ${{ needs.typecheck.outputs.package_profile == 'release' && secrets.ERROR_SERVICE_API_KEY || '' }}
      OTEL_TELEMETRY_ENABLED: ${{ needs.typecheck.outputs.package_profile == 'release' && secrets.OTEL_TELEMETRY_ENABLED || '' }}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${{ needs.typecheck.outputs.package_profile == 'release' && secrets.OTEL_EXPORTER_OTLP_PROTOCOL || '' }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ needs.typecheck.outputs.package_profile == 'release' && secrets.OTEL_EXPORTER_OTLP_ENDPOINT || '' }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ needs.typecheck.outputs.package_profile == 'release' && secrets.OTEL_EXPORTER_OTLP_HEADERS || '' }}
