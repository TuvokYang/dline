name: Docs Pages

# Builds, verifies and deploys the documentation site to GitHub Pages from dev,
# the repository's default branch. Only one branch deploys, so the site never
# alternates between two sources. The deployed artifact is the docs/dist
# directory verified in the same build job.
on:
  push:
    branches: [dev]
    paths:
      - "docs/**"
      - "assets/docs/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions: {}

# Never cancel a running Pages deployment; queue the next one instead.
concurrency:
  group: docs-pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build verified site
    # Manual runs may be started from any ref; only dev is the published source.
    if: github.repository == 'TuvokYang/dline' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install locked docs dependencies
        run: npm ci

      # Builds docs/dist for the /dline/ base and checks that exact output.
      - name: Verify and build docs
        run: npm run verify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
