name: Auto-label Issues

on:
  issues:
    types: [opened, edited]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const body = context.payload.issue.body || '';
            const labels = context.payload.issue.labels.map(l => l.name);

            // Check if VSCode Extension is selected
            if (body.match(/###\s*Plugin Type\s*\n+VSCode Extension/i)) {
              if (!labels.includes('VS Code')) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: ['VS Code']
                });
              }
            }

            // Check if beta version checkbox is checked
            if (body.includes('- [X] I am using a beta version of Dline') || body.includes('- [x] I am using a beta version of Dline')) {
              if (!labels.includes('beta')) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: ['beta']
                });
              }
            }
