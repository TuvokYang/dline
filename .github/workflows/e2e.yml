name: E2E Tests

on:
  workflow_call: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  work-smoke:
    name: Work smoke (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DLINE_E2E_PROFILE: mock-openai
      DLINE_E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-ubuntu-smoke
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          install-webview: "true"

      - name: Cache VS Code
        uses: actions/cache@v5
        with:
          path: .vscode-test
          key: vscode-${{ runner.os }}-stable-${{ hashFiles('.vscode-test.mjs', 'package.json') }}
          restore-keys: |
            vscode-${{ runner.os }}-stable-

      - name: Prepare VS Code and Playwright
        run: node src/test/e2e/utils/build.mjs

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run work smoke
        run: xvfb-run -a npm run e2e:smoke

      - name: Upload failed work smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-work-smoke-ubuntu-${{ github.sha }}
          path: tmp/test-result/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  work-daily:
    name: Shard ${{ matrix.shard.id }} - ${{ matrix.shard.file }} (${{ matrix.runner }})
    needs: work-smoke
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        runner: [ubuntu, windows, macos]
        shard:
          - id: 1
            project: work chat tools
            file: daily-chat-tools.test.ts
            slug: chat-tools
          - id: 2
            project: work background subagents
            file: daily-background-subagents.test.ts
            slug: background-subagents
          - id: 3
            project: work context recovery
            file: daily-context-recovery.test.ts
            slug: context-recovery
          - id: 4
            project: work profiles policies
            file: daily-profiles-policies.test.ts
            slug: profiles-policies
    runs-on: ${{ matrix.runner }}-latest
    timeout-minutes: 30
    env:
      DLINE_E2E_PROFILE: mock-openai
      DLINE_E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}-shard-${{ matrix.shard.id }}-${{ matrix.shard.slug }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          install-webview: "true"

      - name: Cache VS Code
        uses: actions/cache@v5
        with:
          path: .vscode-test
          key: vscode-${{ runner.os }}-stable-${{ hashFiles('.vscode-test.mjs', 'package.json') }}
          restore-keys: |
            vscode-${{ runner.os }}-stable-

      - name: Prepare VS Code and Playwright
        run: node src/test/e2e/utils/build.mjs

      - name: Install xvfb on Linux
        if: matrix.runner == 'ubuntu'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run daily shard - Linux
        if: matrix.runner == 'ubuntu'
        run: xvfb-run -a npm run e2e:work -- "src/test/e2e/work/${{ matrix.shard.file }}" --project "${{ matrix.shard.project }}" --no-deps

      - name: Run daily shard - Non-Linux
        if: matrix.runner != 'ubuntu'
        run: npm run e2e:work -- "src/test/e2e/work/${{ matrix.shard.file }}" --project "${{ matrix.shard.project }}" --no-deps

      - name: Upload failed daily workflow artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-work-shard-${{ matrix.shard.id }}-${{ matrix.shard.slug }}-${{ matrix.runner }}-${{ github.sha }}
          path: tmp/test-result/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
