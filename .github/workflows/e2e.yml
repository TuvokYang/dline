name: E2E Tests

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Exact package workflow artifact consumed by every work E2E job.
        type: string
        required: true
      commit_sha:
        description: Exact commit SHA represented by the tested VSIX.
        type: string
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DLINE_E2E_INSTALL_VSIX: "1"

jobs:
  work-smoke:
    name: Work smoke (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DLINE_E2E_PROFILE: mock-openai
      DLINE_E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-ubuntu-smoke
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          install-webview: "true"

      - name: Generate Protobuf code for E2E harness
        run: npm run protos

      - name: Download tested VSIX
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: tested-vsix

      - name: Normalize tested VSIX
        shell: pwsh
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $expectedArtifact = "dline-vsix-$env:COMMIT_SHA"
          if ($env:ARTIFACT_NAME -ne $expectedArtifact) {
            throw "Expected artifact '$expectedArtifact', got '$env:ARTIFACT_NAME'."
          }
          $assets = @(Get-ChildItem -Path tested-vsix -Filter *.vsix -File)
          if ($assets.Count -ne 1) {
            throw "Expected exactly one tested VSIX, found $($assets.Count)."
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath $assets[0].FullName -Destination dist/e2e.vsix -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath dist/e2e.vsix).Hash.ToLowerInvariant()
          Write-Output "tested_vsix_sha256=$hash"

      - name: Cache VS Code
        uses: actions/cache@v5
        with:
          path: .vscode-test
          key: vscode-${{ runner.os }}-stable-${{ hashFiles('.vscode-test.mjs', 'package.json') }}
          restore-keys: |
            vscode-${{ runner.os }}-stable-

      - name: Prepare VS Code and Playwright
        run: node src/test/e2e/utils/build.mjs

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run packaged work smoke
        run: xvfb-run -a npx playwright test -c playwright.work.config.ts --project "work smoke"

      - name: Upload failed work smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-work-smoke-ubuntu-${{ github.sha }}
          path: tmp/test-result/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  work-daily:
    name: Shard ${{ matrix.shard.id }} - ${{ matrix.shard.file }} (${{ matrix.runner }})
    needs: work-smoke
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        runner: [ubuntu, windows, macos]
        shard:
          - id: 1
            project: work chat tools
            file: daily-chat-tools.test.ts
            slug: chat-tools
          - id: 2
            project: work background subagents
            file: daily-background-subagents.test.ts
            slug: background-subagents
          - id: 3
            project: work context recovery
            file: daily-context-recovery.test.ts
            slug: context-recovery
          - id: 4
            project: work profiles policies
            file: daily-profiles-policies.test.ts
            slug: profiles-policies
    runs-on: ${{ matrix.runner }}-latest
    timeout-minutes: 30
    env:
      DLINE_E2E_PROFILE: mock-openai
      DLINE_E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}-shard-${{ matrix.shard.id }}-${{ matrix.shard.slug }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          install-webview: "true"

      - name: Generate Protobuf code for E2E harness
        run: npm run protos

      - name: Download tested VSIX
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: tested-vsix

      - name: Normalize tested VSIX
        shell: pwsh
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $expectedArtifact = "dline-vsix-$env:COMMIT_SHA"
          if ($env:ARTIFACT_NAME -ne $expectedArtifact) {
            throw "Expected artifact '$expectedArtifact', got '$env:ARTIFACT_NAME'."
          }
          $assets = @(Get-ChildItem -Path tested-vsix -Filter *.vsix -File)
          if ($assets.Count -ne 1) {
            throw "Expected exactly one tested VSIX, found $($assets.Count)."
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath $assets[0].FullName -Destination dist/e2e.vsix -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath dist/e2e.vsix).Hash.ToLowerInvariant()
          Write-Output "tested_vsix_sha256=$hash"

      - name: Cache VS Code
        uses: actions/cache@v5
        with:
          path: .vscode-test
          key: vscode-${{ runner.os }}-stable-${{ hashFiles('.vscode-test.mjs', 'package.json') }}
          restore-keys: |
            vscode-${{ runner.os }}-stable-

      - name: Prepare VS Code and Playwright
        run: node src/test/e2e/utils/build.mjs

      - name: Install xvfb on Linux
        if: matrix.runner == 'ubuntu'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run packaged daily shard - Linux
        if: matrix.runner == 'ubuntu'
        run: xvfb-run -a npx playwright test -c playwright.work.config.ts "src/test/e2e/work/${{ matrix.shard.file }}" --project "${{ matrix.shard.project }}" --no-deps

      - name: Run packaged daily shard - Non-Linux
        if: matrix.runner != 'ubuntu'
        run: npx playwright test -c playwright.work.config.ts "src/test/e2e/work/${{ matrix.shard.file }}" --project "${{ matrix.shard.project }}" --no-deps

      - name: Upload failed daily workflow artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-work-shard-${{ matrix.shard.id }}-${{ matrix.shard.slug }}-${{ matrix.runner }}-${{ github.sha }}
          path: tmp/test-result/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
