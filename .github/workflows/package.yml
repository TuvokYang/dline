name: Package VSIX

on:
  workflow_call:
    inputs:
      profile:
        description: VSIX build profile.
        type: string
        required: false
        default: ci
      channel:
        description: VSIX identity channel.
        type: string
        required: false
        default: ci
      source_ref:
        description: Optional branch, tag, or SHA to package instead of the caller SHA.
        type: string
        required: false
        default: ""
      artifact_key:
        description: Optional stable key used in the uploaded artifact name.
        type: string
        required: false
        default: ""
    outputs:
      artifact_name:
        description: Uploaded workflow artifact name.
        value: ${{ jobs.package-ci.outputs.artifact_name || jobs.package-release.outputs.artifact_name }}
      asset_name:
        description: VSIX filename inside the artifact.
        value: ${{ jobs.package-ci.outputs.asset_name || jobs.package-release.outputs.asset_name }}
      version:
        description: Version read from the packaged extension manifest.
        value: ${{ jobs.package-ci.outputs.version || jobs.package-release.outputs.version }}
      commit_sha:
        description: Exact packaged commit SHA.
        value: ${{ jobs.package-ci.outputs.commit_sha || jobs.package-release.outputs.commit_sha }}
      sha256:
        description: SHA-256 of the packaged VSIX.
        value: ${{ jobs.package-ci.outputs.sha256 || jobs.package-release.outputs.sha256 }}
    secrets:
      TELEMETRY_SERVICE_API_KEY:
        required: false
      ERROR_SERVICE_API_KEY:
        required: false
      OTEL_TELEMETRY_ENABLED:
        required: false
      OTEL_EXPORTER_OTLP_PROTOCOL:
        required: false
      OTEL_EXPORTER_OTLP_ENDPOINT:
        required: false
      OTEL_EXPORTER_OTLP_HEADERS:
        required: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-profile:
    name: Validate package settings
    runs-on: ubuntu-latest
    steps:
      - name: Validate profile and channel
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          CHANNEL: ${{ inputs.channel }}
          ARTIFACT_KEY: ${{ inputs.artifact_key }}
        run: |
          set -euo pipefail
          if [[ "$PROFILE" != "ci" && "$PROFILE" != "release" ]]; then
            echo "Error: package profile must be 'ci' or 'release'"
            exit 1
          fi
          if [[ "$CHANNEL" != "ci" && "$CHANNEL" != "insiders" && "$CHANNEL" != "preview" && "$CHANNEL" != "production" ]]; then
            echo "Error: package channel must be 'ci', 'insiders', 'preview', or 'production'"
            exit 1
          fi
          if [[ "$PROFILE" == "release" && "$CHANNEL" != "production" ]]; then
            echo "Error: the release profile requires the production channel"
            exit 1
          fi
          if [[ "$PROFILE" == "ci" && "$CHANNEL" == "production" ]]; then
            echo "Error: the production channel requires the release profile"
            exit 1
          fi
          if [[ -n "$ARTIFACT_KEY" && ! "$ARTIFACT_KEY" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Error: artifact_key may contain only letters, numbers, '.', '_', and '-'."
            exit 1
          fi

  package-ci:
    name: Package tested VSIX
    needs: validate-profile
    if: inputs.profile == 'ci'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      asset_name: ${{ steps.package.outputs.filename }}
      version: ${{ steps.artifact.outputs.version }}
      commit_sha: ${{ steps.package.outputs.commit_sha }}
      sha256: ${{ steps.artifact.outputs.sha256 }}
    steps:
      - name: Checkout code with LFS assets
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          lfs: true

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          install-webview: "true"
          include-optional: "true"

      - name: Verify LFS assets
        shell: bash
        run: |
          for file in webview-ui/src/assets/cline_kanban_demo.mp4 webview-ui/src/assets/cline_kanban_demo.webm; do
            if grep -q "git-lfs.github.com/spec/v1" "$file"; then
              echo "Error: $file is still a Git LFS pointer"
              exit 1
            fi
          done

      - name: Resolve VSIX filename
        id: package
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          ARTIFACT_KEY: ${{ inputs.artifact_key }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          commit_sha=$(git rev-parse HEAD)
          short_sha="${commit_sha:0:12}"
          artifact_key="${ARTIFACT_KEY:-$commit_sha}"
          case "$CHANNEL" in
            ci)
              filename="dline-ci-${version}-${short_sha}.vsix"
              ;;
            insiders)
              filename="dline-insiders-${short_sha}.vsix"
              ;;
            preview)
              filename="dline-preview-${version}.vsix"
              ;;
            *)
              echo "Error: unsupported CI package channel '$CHANNEL'"
              exit 1
              ;;
          esac
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "artifact_name=dline-vsix-$artifact_key" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Build channel VSIX
        env:
          CHANNEL: ${{ inputs.channel }}
          DLINE_ENVIRONMENT: production
        run: node scripts/package-vsix.mjs --channel "$CHANNEL" --out "dist/${{ steps.package.outputs.filename }}"

      - name: Inspect packaged VSIX
        id: artifact
        env:
          VSIX_PATH: dist/${{ steps.package.outputs.filename }}
        shell: bash
        run: |
          set -euo pipefail
          manifest_path="$RUNNER_TEMP/vsix-package.json"
          unzip -p "$VSIX_PATH" extension/package.json > "$manifest_path"
          echo "version=$(jq -r '.version' "$manifest_path")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$VSIX_PATH" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload tested VSIX
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/${{ steps.package.outputs.filename }}
          if-no-files-found: error
          retention-days: 14

  package-release:
    name: Package release VSIX
    needs: validate-profile
    if: inputs.profile == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: publish
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      asset_name: ${{ steps.package.outputs.filename }}
      version: ${{ steps.artifact.outputs.version }}
      commit_sha: ${{ steps.package.outputs.commit_sha }}
      sha256: ${{ steps.artifact.outputs.sha256 }}
    steps:
      - name: Checkout code with LFS assets
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          lfs: true

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          install-webview: "true"
          include-optional: "true"

      - name: Verify LFS assets
        shell: bash
        run: |
          for file in webview-ui/src/assets/cline_kanban_demo.mp4 webview-ui/src/assets/cline_kanban_demo.webm; do
            if grep -q "git-lfs.github.com/spec/v1" "$file"; then
              echo "Error: $file is still a Git LFS pointer"
              exit 1
            fi
          done

      - name: Resolve VSIX filename
        id: package
        env:
          ARTIFACT_KEY: ${{ inputs.artifact_key }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          commit_sha=$(git rev-parse HEAD)
          artifact_key="${ARTIFACT_KEY:-$commit_sha}"
          echo "filename=dline-${version}.vsix" >> "$GITHUB_OUTPUT"
          echo "artifact_name=dline-vsix-$artifact_key" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Build production VSIX
        env:
          DLINE_ENVIRONMENT: production
          TELEMETRY_SERVICE_API_KEY: ${{ secrets.TELEMETRY_SERVICE_API_KEY }}
          ERROR_SERVICE_API_KEY: ${{ secrets.ERROR_SERVICE_API_KEY }}
          OTEL_TELEMETRY_ENABLED: ${{ secrets.OTEL_TELEMETRY_ENABLED }}
          OTEL_LOGS_EXPORTER: otlp
          OTEL_METRICS_EXPORTER: otlp
          OTEL_EXPORTER_OTLP_PROTOCOL: ${{ secrets.OTEL_EXPORTER_OTLP_PROTOCOL }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        run: node scripts/package-vsix.mjs --channel production --out "dist/${{ steps.package.outputs.filename }}"

      - name: Inspect packaged VSIX
        id: artifact
        env:
          VSIX_PATH: dist/${{ steps.package.outputs.filename }}
        shell: bash
        run: |
          set -euo pipefail
          manifest_path="$RUNNER_TEMP/vsix-package.json"
          unzip -p "$VSIX_PATH" extension/package.json > "$manifest_path"
          echo "version=$(jq -r '.version' "$manifest_path")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$VSIX_PATH" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload release VSIX
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/${{ steps.package.outputs.filename }}
          if-no-files-found: error
          retention-days: 14
