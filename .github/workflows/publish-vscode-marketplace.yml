name: Production Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Validated production tag to release (vX.Y.Z).
        type: string
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: read
  contents: read

concurrency:
  group: production-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish validated GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: publish
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    outputs:
      commit_sha: ${{ steps.validation.outputs.commit_sha }}
      asset_name: ${{ steps.validation.outputs.asset_name }}
      sha256: ${{ steps.vsix.outputs.sha256 }}
    steps:
      - name: Checkout validated tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify tag and successful production validation
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Error: production tag must match vX.Y.Z, got '$TAG'."
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          package_version=$(node -p "require('./package.json').version")
          if [[ "$version" != "$package_version" ]]; then
            echo "Error: tag version '$version' does not match package version '$package_version'."
            exit 1
          fi

          tag_sha=$(git rev-parse "${TAG}^{commit}")
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          compare_json=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${tag_sha}...${main_sha}")
          if [[ "$(jq -r '.merge_base_commit.sha' <<<"$compare_json")" != "$tag_sha" ]]; then
            echo "Error: production tag '$TAG' is not an ancestor of main '$main_sha'."
            exit 1
          fi

          validation_run_id=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?event=push&status=success&per_page=100" \
            --jq ".workflow_runs[] | select(.head_sha == \"$tag_sha\" and .head_branch == \"$TAG\") | .id" | head -n 1)
          if [[ -z "$validation_run_id" ]]; then
            echo "Error: no successful Production Release Validation run exists for '$TAG' at '$tag_sha'."
            exit 1
          fi

          echo "commit_sha=$tag_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset_name=dline-${version}.vsix" >> "$GITHUB_OUTPUT"
          echo "validation_run_id=$validation_run_id" >> "$GITHUB_OUTPUT"

      - name: Download validated VSIX artifact
        uses: actions/download-artifact@v6
        with:
          name: dline-vsix-${{ steps.validation.outputs.commit_sha }}
          path: tested-artifact
          github-token: ${{ github.token }}
          run-id: ${{ steps.validation.outputs.validation_run_id }}

      - name: Verify validated production VSIX
        id: vsix
        env:
          VERSION: ${{ steps.validation.outputs.version }}
          ASSET_NAME: ${{ steps.validation.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          tested_vsix="tested-artifact/$ASSET_NAME"
          manifest_path="$RUNNER_TEMP/vsix-package.json"

          if [[ ! -s "$tested_vsix" ]]; then
            echo "Error: validated VSIX '$tested_vsix' is missing or empty."
            exit 1
          fi
          unzip -p "$tested_vsix" extension/package.json > "$manifest_path"
          if ! jq -e --arg version "$VERSION" '
            .name == "dline" and
            .publisher == "tuvokyang" and
            .version == $version and
            (.preview != true)
          ' "$manifest_path" >/dev/null; then
            echo "Error: validated VSIX does not match the production release."
            jq '{name, publisher, version, preview}' "$manifest_path"
            exit 1
          fi

          tested_sha=$(sha256sum "$tested_vsix" | cut -d' ' -f1)
          echo "$tested_sha  $tested_vsix"
          echo "path=$tested_vsix" >> "$GITHUB_OUTPUT"
          echo "sha256=$tested_sha" >> "$GITHUB_OUTPUT"

      - name: Attest validated VSIX provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.vsix.outputs.path }}

      - name: Create or update production release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VSIX_PATH: ${{ steps.vsix.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --draft=false \
              --prerelease=false \
              --title "Dline ${TAG}" \
              --repo "$GITHUB_REPOSITORY"
            gh release upload "$TAG" "$VSIX_PATH" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$VSIX_PATH" \
              --verify-tag \
              --generate-notes \
              --title "Dline ${TAG}" \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Upload verified registry package
        uses: actions/upload-artifact@v5
        with:
          name: registry-vsix-${{ steps.validation.outputs.commit_sha }}
          path: tested-artifact/${{ steps.validation.outputs.asset_name }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-registries:
    name: Publish production registries
    needs: release
    uses: ./.github/workflows/publish-vsix-registries.yml
    with:
      artifact_name: registry-vsix-${{ needs.release.outputs.commit_sha }}
      asset_name: ${{ needs.release.outputs.asset_name }}
      expected_sha256: ${{ needs.release.outputs.sha256 }}
    secrets: inherit
