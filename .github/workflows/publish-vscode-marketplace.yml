name: Production Release (Manual Override)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Production tag to publish (vX.Y.Z).
        type: string
        required: true
      reason:
        description: Reason for bypassing or replacing the automatic release path.
        type: string
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: read
  contents: read

concurrency:
  group: production-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate manual production release request
    if: github.repository == 'TuvokYang/dline'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.validation.outputs.tag }}
      version: ${{ steps.validation.outputs.version }}
      commit_sha: ${{ steps.validation.outputs.commit_sha }}
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify tag and main ancestry
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REASON: ${{ inputs.reason }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Error: production tag must match vX.Y.Z, got '$TAG'."
            exit 1
          fi
          if [[ -z "${REASON// }" ]]; then
            echo "Error: a manual override reason is required."
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          package_version=$(node -p "require('./package.json').version")
          if [[ "$version" != "$package_version" ]]; then
            echo "Error: tag version '$version' does not match package version '$package_version'."
            exit 1
          fi
          tag_sha=$(git rev-parse "${TAG}^{commit}")
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          compare_json=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${tag_sha}...${main_sha}")
          if [[ "$(jq -r '.merge_base_commit.sha' <<<"$compare_json")" != "$tag_sha" ]]; then
            echo "Error: production tag '$TAG' is not an ancestor of main '$main_sha'."
            exit 1
          fi
          echo "::warning::Manual production override requested: $REASON"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$tag_sha" >> "$GITHUB_OUTPUT"

  package:
    name: Build fresh production VSIX
    needs: validate
    uses: ./.github/workflows/package.yml
    with:
      profile: release
      channel: production
      source_ref: ${{ needs.validate.outputs.tag }}
      artifact_key: ${{ needs.validate.outputs.commit_sha }}
    secrets:
      TELEMETRY_SERVICE_API_KEY: ${{ secrets.TELEMETRY_SERVICE_API_KEY }}
      ERROR_SERVICE_API_KEY: ${{ secrets.ERROR_SERVICE_API_KEY }}
      OTEL_TELEMETRY_ENABLED: ${{ secrets.OTEL_TELEMETRY_ENABLED }}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${{ secrets.OTEL_EXPORTER_OTLP_PROTOCOL }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

  publish:
    name: Publish manual production release
    needs: [validate, package]
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-production-release.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
      version: ${{ needs.validate.outputs.version }}
      commit_sha: ${{ needs.validate.outputs.commit_sha }}
      artifact_name: ${{ needs.package.outputs.artifact_name }}
      asset_name: ${{ needs.package.outputs.asset_name }}
    secrets: inherit
