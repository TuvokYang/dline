name: 🐛 Bug Report
description: File a bug report
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        **Security:** Do not disclose a suspected vulnerability here. Use [GitHub Private Vulnerability Reporting](https://github.com/TuvokYang/dline/security/advisories/new).

        For product bugs, include the Dline version and the Profile/provider/model that reproduces the behavior. No specific model is required.
  - type: input
    id: dline-version
    attributes:
      label: Dline Version
      description: What version of Dline are you using? Include the commit suffix when shown.
      placeholder: 'e.g., 0.11.1-abcdef123'
    validations:
      required: true
  - type: checkboxes
    id: beta
    attributes:
      label: Beta version
      options:
        - label: I am using a pre-release or Insiders version of Dline
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How do you trigger this bug? Please walk us through it step by step.
      value: |
        1.
        2.
        3.
    validations:
      required: false
  - type: input
    id: provider-model
    attributes:
      label: Provider/Model
      description: What provider and model were you using when the issue occurred?
      placeholder: 'e.g., anthropic:claude-sonnet-4.5, openai-compatible:my-model'
    validations:
      required: false
  - type: textarea
    id: system-info
    attributes:
      label: System Information
      description: What operating system and hardware are you using?
      placeholder: |
        Operating System: Windows 11, macOS Sonoma, Ubuntu 22.04, etc.
        Hardware: CPU, GPU, RAM specifications if relevant
        e.g.,
        OS: Windows 11
        CPU: Intel Core i7-11700K
        GPU: NVIDIA GeForce RTX 3070
        RAM: 32GB DDR4
    validations:
      required: false
