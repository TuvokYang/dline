// Account usage quota for rate-limited providers (e.g., Codex, Copilot)
message UsageQuota {
  string type = 1;           // "daily" | "5hour" | "weekly" | "monthly" | "custom"
  string label = 2;          // Human-readable label
  int64 used = 3;            // Tokens or percentage consumed
  int64 limit = 4;           // Token or percentage limit
  optional string reset_at = 5;       // ISO timestamp
  optional string reset_label = 6;    // Human-readable reset description
  optional int64 window_seconds = 7;  // Duration of the quota window
  // Compact label for space-constrained surfaces such as the chat input bar.
  // Providers name their windows differently (a calendar week versus a rolling
  // seven days), so the provider supplies it rather than the UI deriving one
  // from `type`.
  optional string short_label = 8;
}

// Provider-owned reset credit exposed through the shared usage capability.
message AccountUsageResetCredit {
  string id = 1;
  optional string granted_at = 2;     // ISO timestamp
  optional string expires_at = 3;     // ISO timestamp
}

// Account-level usage or balance information
message AccountUsage {
  string currency = 1;                     // "CNY", "USD", etc.
  optional double remaining_balance = 2;
  optional double topped_up_balance = 3;
  optional double granted_balance = 4;
  repeated UsageQuota quotas = 5;          // Quota windows for quota-mode providers
  optional bool is_available = 6;
  optional int64 daily_input_tokens = 7;
  optional int64 daily_output_tokens = 8;
  optional int64 daily_cache_hit_tokens = 9;
  optional int64 daily_cache_miss_tokens = 10;
  optional string profile_id = 11;
  optional string provider_id = 12;
  optional string plan_type = 13;
  optional bool allowed = 14;
  optional bool limit_reached = 15;
  repeated AccountUsageResetCredit reset_credits = 16;
  optional uint32 reset_credits_available_count = 17;
  // ISO timestamp of the read that produced this snapshot. A snapshot is kept
  // until the user refreshes it, so the surfaces state its age rather than
  // implying the numbers are current.
  optional string retrieved_at = 18;
}

message State {
  string state_json = 1;
  optional AccountUsage account_usage = 2;
}

message TerminalProfiles {
  repeated TerminalProfile profiles = 1;
}

message TerminalProfile {
  string id = 1;
  string name = 2;
  optional string path = 3;
  optional string description = 4;
}

message TerminalProfileUpdateResponse {
  int32 closed_count = 1;
  int32 busy_terminals_count = 2;
  bool has_busy_terminals = 3;
}

message TogglePlanActModeRequest {
  Metadata metadata = 1;
  PlanActMode mode = 2;
  optional ChatContent chat_content = 3;
}

enum ModeSwitchStatus {
  MODE_SWITCH_STATUS_UNSPECIFIED = 0;
  MODE_SWITCH_STATUS_SWITCHED = 1;
  MODE_SWITCH_STATUS_CONFIRMATION_REQUIRED = 2;
  MODE_SWITCH_STATUS_IN_PROGRESS = 3;
  MODE_SWITCH_STATUS_REJECTED = 4;
}

message ModeSwitchResponse {
  ModeSwitchStatus status = 1;
  optional string operation_id = 2;
  optional string error = 3;
}

message ModeSwitchOperationRequest {
  Metadata metadata = 1;
  string operation_id = 2;
}

message ProfileSwitchRequest {
  Metadata metadata = 1;
  string target_profile = 2;
  repeated PlanActMode target_modes = 3;
  optional ChatContent chat_content = 4;
}

enum ProfileSwitchStatus {
  PROFILE_SWITCH_STATUS_UNSPECIFIED = 0;
  PROFILE_SWITCH_STATUS_SWITCHED = 1;
  PROFILE_SWITCH_STATUS_CONFIRMATION_REQUIRED = 2;
  PROFILE_SWITCH_STATUS_IN_PROGRESS = 3;
  PROFILE_SWITCH_STATUS_REJECTED = 4;
}

message ProfileSwitchResponse {
  ProfileSwitchStatus status = 1;
  optional string operation_id = 2;
  optional string error = 3;
}

message ProfileSwitchOperationRequest {
  Metadata metadata = 1;
  string operation_id = 2;
}

enum ContextCompactionRestoreTarget {
  CONTEXT_COMPACTION_RESTORE_TARGET_UNSPECIFIED = 0;
  CONTEXT_COMPACTION_RESTORE_TARGET_PREVIOUS = 1;
  CONTEXT_COMPACTION_RESTORE_TARGET_INITIAL = 2;
}

message ContextCompactionRestoreRequest {
  Metadata metadata = 1;
  string operation_id = 2;
  ContextCompactionRestoreTarget target = 3;
  string expected_head_checkpoint_id = 4;
  int32 expected_chain_revision = 5;
}

enum ContextCompactionRestoreStatus {
  CONTEXT_COMPACTION_RESTORE_STATUS_UNSPECIFIED = 0;
  CONTEXT_COMPACTION_RESTORE_STATUS_RESTORED = 1;
  CONTEXT_COMPACTION_RESTORE_STATUS_REJECTED = 2;
}

message ContextCompactionRestoreResponse {
  ContextCompactionRestoreStatus status = 1;
  optional string operation_id = 2;
  optional string checkpoint_id = 3;
  optional string head_checkpoint_id = 4;
  optional int32 chain_revision = 5;
  optional string branch_id = 6;
  optional string error = 7;
}

enum PlanActMode {
  PLAN = 0;
  ACT = 1;
}

enum OpenaiReasoningEffort {
  LOW = 0;
  MEDIUM = 1;
  HIGH = 2;
  reserved 3; // was MINIMAL
}

enum McpDisplayMode {
  RICH = 0;
  PLAIN = 1;
  MARKDOWN = 2;
}

message ChatContent {
  optional string message = 1;
  repeated string images = 2;
  repeated string files = 3;
}

message ResetStateRequest {
  Metadata metadata = 1;
  optional bool global = 2;
}

message AutoApprovalSettingsRequest {
  Metadata metadata = 1;
  optional int32 version = 2;
  AutoApprovalActions actions = 3;
  optional bool enable_notifications = 4;
}

enum TelemetrySettingEnum {
  UNSET = 0;
  ENABLED = 1;
  DISABLED = 2;
}

message TelemetrySettingRequest {
  reserved 2; // was a single setting covering usage and error together
  Metadata metadata = 1;
  TelemetrySettingEnum usage_setting = 3;
  TelemetrySettingEnum error_setting = 4;
}

// Browser settings for UpdateSettingsRequest
message BrowserSettingsUpdate {
  optional Viewport viewport = 1;
  optional string remote_browser_host = 2;
  optional bool remote_browser_enabled = 3;
  optional string chrome_executable_path = 4;
  optional bool disable_tool_use = 5;
  optional string custom_args = 6;
}

message UpdateTaskSettingsRequest {
  Metadata metadata = 1;
  optional Settings settings = 2;
  optional string task_id = 3;
}

// Message for updating settings
message UpdateSettingsRequest {
  reserved 15; // was openai_reasoning_effort (moved to mode-scoped reasoning effort)
  reserved 23; // was dictation_settings (dictation removed)
  reserved 38; // was skills_enabled (removed - now always enabled)

  Metadata metadata = 1;
  optional ModelsApiConfiguration api_configuration = 2;
  reserved 3; // was telemetry_setting; usage and error are consented separately
  optional bool plan_act_separate_models_setting = 4;
  optional bool enable_checkpoints_setting = 5;
  optional bool mcp_marketplace_enabled = 6;
  optional int32 shell_integration_timeout = 8;
  optional bool terminal_reuse_enabled = 9;
  optional bool mcp_responses_collapsed = 10;
  optional McpDisplayMode mcp_display_mode = 11;
  optional int32 terminal_output_line_limit = 12;
  optional PlanActMode mode = 13;
  optional string preferred_language = 14;
  optional bool strict_plan_mode_enabled = 16;
  optional FocusChainSettings focus_chain_settings = 17;
  optional bool use_auto_condense = 18;
  optional string custom_prompt = 19;
  optional BrowserSettingsUpdate browser_settings = 20;
  optional string default_terminal_profile = 21;
  optional bool yolo_mode_toggled = 22;
  optional bool multi_root_enabled = 25;
  optional bool hooks_enabled = 26;
  optional string vscode_terminal_execution_mode = 27;
  optional int32 max_consecutive_mistakes = 28;
  optional bool subagents_enabled = 29;
  optional int32 subagent_terminal_output_line_limit = 30;
  optional string cline_env = 31;
  optional bool native_tool_call_enabled = 32;
  optional OnboardingModelGroup onboarding_models = 33;
  optional bool cline_web_tools_enabled = 34;
  optional bool enable_parallel_tool_calling = 35;
  optional bool background_edit_enabled = 36;
  optional string oca_reasoning_effort = 37;
  optional bool opt_out_of_remote_config = 39;
  optional bool worktrees_enabled = 40;
  optional bool double_check_completion_enabled = 41;
  optional bool show_feature_tips = 42;
  optional bool lazy_teammate_mode_enabled = 43;

  // Profile-driven model selection (replaces legacy plan_mode_*/act_mode_* fields)
  optional string plan_mode_profile = 44;
  optional string act_mode_profile = 45;
  optional bool show_active_tasks_in_env_details = 46;
  optional string chat_input_send_shortcut = 47;
  optional int32 terminal_command_timeout_seconds = 48;
  optional int32 auto_condense_trigger_percent = 49;
  optional int32 auto_condense_max_context_tokens = 50;
  optional string local_web_search_engine = 51;
  optional string searxng_search_url = 52;
  optional string searxng_search_token = 53;
  optional int32 terminal_command_handoff_seconds = 54;
  optional bool mcp_enabled = 55;
  optional int32 auto_condense_min_reserve_tokens = 56;
  optional int32 auto_condense_max_reserve_tokens = 57;
  optional string image_profile = 58;
  optional bool image_generation_enabled = 59;
  optional string image_profile_id = 60;
  optional string usage_reporting_setting = 61;
  optional string error_reporting_setting = 62;
  optional int32 max_parallel_tool_calls = 63;
