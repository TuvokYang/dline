syntax = "proto3";
package dline;

import "dline/browser.proto";
import "dline/common.proto";
import "dline/models.proto";

option go_package = "github.com/dline/grpc-go/dline";
option java_multiple_files = true;
option java_package = "bot.dline.proto";

service StateService {
  rpc getLatestState(EmptyRequest) returns (State);
  rpc updateTerminalConnectionTimeout(UpdateTerminalConnectionTimeoutRequest) returns (UpdateTerminalConnectionTimeoutResponse);
  rpc updateTerminalReuseEnabled(BooleanRequest) returns (Empty);
  rpc getAvailableTerminalProfiles(EmptyRequest) returns (TerminalProfiles);
  rpc subscribeToState(EmptyRequest) returns (stream State);
  rpc toggleFavoriteModel(StringRequest) returns (Empty);
  rpc resetState(ResetStateRequest) returns (Empty);
  rpc togglePlanActModeProto(TogglePlanActModeRequest) returns (ModeSwitchResponse);
  rpc confirmModeSwitch(ModeSwitchOperationRequest) returns (ModeSwitchResponse);
  rpc cancelModeSwitch(ModeSwitchOperationRequest) returns (ModeSwitchResponse);
  rpc requestProfileSwitch(ProfileSwitchRequest) returns (ProfileSwitchResponse);
  rpc confirmProfileSwitch(ProfileSwitchOperationRequest) returns (ProfileSwitchResponse);
  rpc cancelProfileSwitch(ProfileSwitchOperationRequest) returns (ProfileSwitchResponse);
  rpc restoreContextCompaction(ContextCompactionRestoreRequest) returns (ContextCompactionRestoreResponse);
  rpc updateAutoApprovalSettings(AutoApprovalSettingsRequest) returns (Empty);
  rpc updateSettings(UpdateSettingsRequest) returns (Empty);
  rpc updateTaskSettings(UpdateTaskSettingsRequest) returns (Empty);
  rpc updateTelemetrySetting(TelemetrySettingRequest) returns (Empty);
  rpc captureOnboardingProgress(OnboardingProgressRequest) returns (Empty);
  rpc setWelcomeViewCompleted(BooleanRequest) returns (Empty);
  rpc getProcessInfo(EmptyRequest) returns (ProcessInfo);
  rpc flushPendingState(EmptyRequest) returns (Empty);
  rpc refreshRemoteConfig(EmptyRequest) returns (Empty);
  rpc testOtelConnection(EmptyRequest) returns (TestConnectionResult);
  rpc testPromptUploading(EmptyRequest) returns (TestConnectionResult);
  rpc exportRuntimeTelemetryBundle(ExportRuntimeTelemetryBundleRequest) returns (ExportRuntimeTelemetryBundleResponse);
}

// Ask the extension host to write a diagnostic bundle to disk.
message ExportRuntimeTelemetryBundleRequest {
  // Opt in to including raw artifacts. Absent means the default: excluded.
  optional bool include_raw_artifacts = 1;
}

// Outcome of an export attempt.
//
// The host chooses the destination, so an export either produces an archive or
// explains why it could not.
message ExportRuntimeTelemetryBundleResponse {
  reserved 1;
  reserved "cancelled";
  // Absolute path of the written archive. Empty when the export failed.
  string path = 2;
  // Bytes on disk, so the UI can tell an empty bundle from a real one.
  int64 size_bytes = 3;
  // Human-readable failure reason. Empty on success.
  string error = 4;
}

message AutoApprovalActions {
  optional bool read_files = 1;
  optional bool read_files_externally = 2;
  optional bool edit_files = 3;
  optional bool edit_files_externally = 4;
  optional bool execute_safe_commands = 5;
  optional bool execute_all_commands = 6;
  optional bool use_browser = 7;
  optional bool use_mcp = 8;
  optional bool focus_chain = 9;
  optional bool use_web = 10;
  optional bool generate_images = 11;
}

// Auto approval settings for task execution
message AutoApprovalSettings {
  int32 version = 1;
  AutoApprovalActions actions = 2;
  optional bool enable_notifications = 3;
}

