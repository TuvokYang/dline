syntax = "proto3";

package dline;

import "dline/common.proto";

option go_package = "github.com/dline/grpc-go/dline";
option java_multiple_files = true;
option java_package = "bot.dline.proto";

// Enum for ClineMessage type
enum ClineMessageType {
  ASK = 0;
  SAY = 1;
}

// Enum for ClineAsk types
enum ClineAsk {
  FOLLOWUP = 0;
  MAKE_PLAN = 1;
  COMMAND = 2;
  COMMAND_OUTPUT = 3;
  COMPLETION_RESULT = 4;
  TOOL = 5;
  API_REQ_FAILED = 6;
  RESUME_TASK = 7;
  RESUME_COMPLETED_TASK = 8;
  MISTAKE_LIMIT_REACHED = 9;
  BROWSER_ACTION_LAUNCH = 10;
  USE_MCP_SERVER = 11;
  NEW_TASK = 12;
  CONDENSE = 13;
  REPORT_BUG = 14;
  SUMMARIZE_TASK = 15;
  ACT_MODE_RESPOND = 16;
  USE_SUBAGENTS = 17;
  SPAWN_TASK = 18;
  QNA_RESPOND = 19;
  CHANGE_TODO_LIST = 20;
  STATUS_ACKNOWLEDGMENT = 21;
  GENERATE_REPORT_ASK = 22;
}

// Enum for ClineSay types
enum ClineSay {
  TASK = 0;
  ERROR = 1;
  API_REQ_STARTED = 2;
  API_REQ_FINISHED = 3;
  TEXT = 4;
  REASONING = 5;
  COMPLETION_RESULT_SAY = 6;
  USER_FEEDBACK = 7;
  USER_FEEDBACK_DIFF = 8;
  API_REQ_RETRIED = 9;
  COMMAND_SAY = 10;
  COMMAND_OUTPUT_SAY = 11;
  TOOL_SAY = 12;
  SHELL_INTEGRATION_WARNING = 13;
  BROWSER_ACTION_LAUNCH_SAY = 14;
  BROWSER_ACTION = 15;
  BROWSER_ACTION_RESULT = 16;
  MCP_SERVER_REQUEST_STARTED = 17;
  MCP_SERVER_RESPONSE = 18;
  MCP_NOTIFICATION = 19;
  USE_MCP_SERVER_SAY = 20;
  DIFF_ERROR = 21;
  DELETED_API_REQS = 22;
  CLINEIGNORE_ERROR = 23;
  CHECKPOINT_CREATED = 24;
  LOAD_MCP_DOCUMENTATION = 25;
  INFO = 26;
  TASK_PROGRESS = 27;
  ERROR_RETRY = 28;
  GENERATE_EXPLANATION = 29;
  HOOK_STATUS = 30;
  HOOK_OUTPUT_STREAM = 31;
  COMMAND_PERMISSION_DENIED = 32;
  CONDITIONAL_RULES_APPLIED = 33;
  SUBAGENT_STATUS = 34;
  USE_SUBAGENTS_SAY = 35;
  SUBAGENT_USAGE = 36;
  QNA_RESPOND_SAY = 37;
  PARTIAL_TOOL_RESULT = 38;
  STATE_SNAPSHOT = 39;
}

// Enum for ClineSayTool tool types
enum ClineSayToolType {
  EDITED_EXISTING_FILE = 0;
  NEW_FILE_CREATED = 1;
  READ_FILE = 2;
  LIST_FILES_TOP_LEVEL = 3;
  LIST_FILES_RECURSIVE = 4;
  LIST_CODE_DEFINITION_NAMES = 5;
  SEARCH_FILES = 6;
  WEB_FETCH = 7;
  FILE_DELETED = 8;
  FIND_REFERENCES = 9;
  RENAME_SYMBOL = 10;
  REPLACE_TEXT = 11;
}

// Enum for browser actions
enum BrowserAction {
  LAUNCH = 0;
  CLICK = 1;
  TYPE = 2;
  SCROLL_DOWN = 3;
  SCROLL_UP = 4;
  CLOSE = 5;
}

// Enum for MCP server request types
enum McpServerRequestType {
  USE_MCP_TOOL = 0;
  ACCESS_MCP_RESOURCE = 1;
}

// Enum for API request cancel reasons
enum ClineApiReqCancelReason {
  STREAMING_FAILED = 0;
  USER_CANCELLED = 1;
  RETRIES_EXHAUSTED = 2;
}

// Message for conversation history deleted range
message ConversationHistoryDeletedRange {
  int32 start_index = 1;
  int32 end_index = 2;
}

// Canonical pre-compaction boundary for ordinary Restore Chat.
message CompactionConversationRange {
  int32 logical_turn_start_index = 1;
  int32 logical_turn_end_index = 2;
  int32 api_conversation_start_index = 3;
  int32 api_conversation_end_index = 4;
  int32 pre_compaction_api_end_index = 5;
}

// Match entry for rename / replace_text tools
message ClineSayMatch {
  string file = 1;
  uint32 line = 2;
  string original_text = 3;
  string new_text = 4;
  string diff = 5;
}

// Reference entry for find_references tool
message ClineSayReference {
  string file = 1;
  uint32 line = 2;
  uint32 character = 3;
  string context = 4;
}

// Message for ClineSayTool
message ClineSayTool {
  ClineSayToolType tool = 1;
  string path = 2;
  string diff = 3;
  string content = 4;
  string regex = 5;
  string file_pattern = 6;
  bool operation_is_located_in_workspace = 7;
  repeated ClineSayMatch matches = 8;
  repeated ClineSayReference references = 9;
  string symbol_name = 10;
  uint32 files = 11;
  uint32 count = 12;
  bool dry_run = 13;
}

// Message for ClineSayBrowserAction
message ClineSayBrowserAction {
  BrowserAction action = 1;
  string coordinate = 2;
  string text = 3;
}

// Message for BrowserActionResult
message BrowserActionResult {
  string screenshot = 1;
  string logs = 2;
  string current_url = 3;
  string current_mouse_position = 4;
}

// Message for ClineAskUseMcpServer
message ClineAskUseMcpServer {
  string server_name = 1;
  McpServerRequestType type = 2;
  string tool_name = 3;
  string arguments = 4;
  string uri = 5;
}

// Message for ClineMakePlanResponse
message ClineMakePlanResponse {
  string response = 1;
}

// Message for ClineAskQuestion
message ClineAskQuestion {
  string question = 1;
  repeated string options = 2;
  string selected = 3;
}

// Message for ClineAskNewTask
message ClineAskNewTask {
  string context = 1;
}

// Message for ClineAskSpawnTask
message ClineAskSpawnTask {
  string task = 1;
  string context = 2;
}

// Message for API request retry status
message ApiReqRetryStatus {
  int32 attempt = 1;
  int32 max_attempts = 2;
  int32 delay_sec = 3;
  string error_snippet = 4;
}

// Message for ClineApiReqInfo
message ClineApiReqInfo {
  string request = 1;
  int32 tokens_in = 2;
  int32 tokens_out = 3;
  int32 cache_writes = 4;
  int32 cache_reads = 5;
  double cost = 6;
  ClineApiReqCancelReason cancel_reason = 7;
  string streaming_failed_message = 8;
  ApiReqRetryStatus retry_status = 9;
}

message ClineModelInfo {
  string provider_id = 1;
  string model_id = 2;
}

message ImageGenerationArtifact {
  string id = 1;
  string mime_type = 2;
  string format = 3;
  int64 byte_length = 4;
  uint32 width = 5;
  uint32 height = 6;
  optional string revised_prompt = 7;
}

message ImageGenerationPreview {
  string id = 1;
  string mime_type = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 sequence = 5;
}

message ImageGenerationUsage {
  uint32 image_count = 1;
  optional int64 total_output_bytes = 2;
  optional double estimated_cost_usd = 3;
  optional string currency = 4;
}

message ImageGenerationError {
  optional string code = 1;
  string message = 2;
  optional bool retryable = 3;
}

message ImageGenerationPresentation {
  uint32 schema_version = 1;
  string status = 2;
  string request_id = 3;
  string prompt = 4;
  optional string profile_id = 5;
  optional string provider_id = 6;
  optional string model_id = 7;
  uint32 count = 8;
  repeated ImageGenerationArtifact artifacts = 9;
  optional ImageGenerationUsage usage = 10;
  optional ImageGenerationError error = 11;
  optional ImageGenerationPreview preview = 12;
  repeated ImageGenerationPreview previews = 13;
}

message ImageArtifactRequest {
  string artifact_id = 1;
}

message ImagePreviewRequest {
  string preview_id = 1;
}

message ImageArtifactContent {
  bytes data = 1;
  string mime_type = 2;
}

// Main ClineMessage type
message ClineMessage {
  int64 ts = 1;
  ClineMessageType type = 2;
  ClineAsk ask = 3;
  ClineSay say = 4;
  string text = 5;
  string reasoning = 6;
  repeated string images = 7;
  repeated string files = 8;
  bool partial = 9;
  repeated string last_checkpoint_hash = 10;
  bool is_checkpoint_checked_out = 11;
  bool is_operation_outside_workspace = 12;
  int32 conversation_history_index = 13;
  ConversationHistoryDeletedRange conversation_history_deleted_range = 14;

  // Additional fields for specific ask/say types
  ClineSayTool say_tool = 15;
  ClineSayBrowserAction say_browser_action = 16;
  BrowserActionResult browser_action_result = 17;
  ClineAskUseMcpServer ask_use_mcp_server = 18;
  ClineMakePlanResponse make_plan_response = 19;
  ClineAskQuestion ask_question = 20;
  ClineAskNewTask ask_new_task = 21;
  ClineApiReqInfo api_req_info = 22;
  ClineModelInfo model_info = 23;
  string command_status = 24;
  int64 exit_code = 25;
  string log_path = 26;
  ClineAskSpawnTask ask_spawn_task = 27;
  int64 command_ts = 28;
  string activity_id = 29;
  string interaction_id = 30;
  string command_execution_mode = 31;
  bool command_can_move_to_background = 32;
  CompactionConversationRange compaction_conversation_range = 33;
  string user_input_kind = 34;
  string queued_input_mode = 35;
  optional ImageGenerationPresentation image_generation = 36;
  // Whether this completion produced workspace changes that can be diffed.
  bool completion_has_changes = 37;
  // Workspace identities aligned with last_checkpoint_hash.
  repeated string checkpoint_workspace_roots = 38;
}

message ShowWebviewEvent {
  bool preserve_editor_focus = 1; // When true, webview should not steal focus from editor
}

// UiService provides methods for managing UI interactions
service UiService {
  // Scrolls to a specific settings section in the settings view
  rpc scrollToSettings(StringRequest) returns (KeyValuePair);

  // Sets the terminal execution mode (vscodeTerminal or backgroundExec)
  rpc setTerminalExecutionMode(BooleanRequest) returns (KeyValuePair);

  // Marks the current announcement as shown and returns whether an announcement should still be shown
  rpc onDidShowAnnouncement(EmptyRequest) returns (Boolean);

  // Subscribe to addToInput events (when user adds content via context menu)
  rpc subscribeToAddToInput(EmptyRequest) returns (stream String);

  // Subscribe to MCP button clicked events
  rpc subscribeToMcpButtonClicked(EmptyRequest) returns (stream Empty);

  // Subscribe to history button click events
  rpc subscribeToHistoryButtonClicked(EmptyRequest) returns (stream Empty);

  // Subscribe to chat button clicked events (when the chat button is clicked in VSCode)
  rpc subscribeToChatButtonClicked(EmptyRequest) returns (stream Empty);

  // Subscribe to account button click events
  rpc subscribeToAccountButtonClicked(EmptyRequest) returns (stream Empty);

  // Subscribe to settings button clicked events
  rpc subscribeToSettingsButtonClicked(EmptyRequest) returns (stream Empty);

  // Subscribe to worktrees button clicked events
  rpc subscribeToWorktreesButtonClicked(EmptyRequest) returns (stream Empty);

  // Subscribe to partial message updates (streaming Cline messages as they're built)
  rpc subscribeToPartialMessage(EmptyRequest) returns (stream ClineMessage);

  // Initialize webview when it launches
  rpc initializeWebview(EmptyRequest) returns (Empty);

  // Subscribe to relinquish control events
  rpc subscribeToRelinquishControl(EmptyRequest) returns (stream Empty);

  // Subscribe to show webview events
  rpc subscribeToShowWebview(EmptyRequest) returns (stream ShowWebviewEvent);

  // Returns the HTML for the webview index page. This is only used by external clients, not by the vscode webview.
  rpc getWebviewHtml(EmptyRequest) returns (String);

  // Opens a URL in the default browser
  rpc openUrl(StringRequest) returns (Empty);

  // Returns verified bytes for an image artifact owned by the active task.
  rpc getImageArtifact(ImageArtifactRequest) returns (ImageArtifactContent);

  // Returns verified bytes for an ephemeral preview owned by the active task.
  rpc getImagePreview(ImagePreviewRequest) returns (ImageArtifactContent);

  // Opens a durable image artifact without materializing a system-temp copy.
  rpc openImageArtifact(ImageArtifactRequest) returns (Empty);

  // Opens the Cline walkthrough
  rpc openWalkthrough(EmptyRequest) returns (Empty);
}
