syntax = "proto3";

package dline;

option go_package = "github.com/dline/grpc-go/dline";
option java_multiple_files = true;
option java_package = "bot.dline.proto";

import "dline/models.proto";
import "dline/provider/anthropic.proto";
import "dline/provider/bedrock.proto";
import "dline/provider/vertex.proto";
import "dline/provider/sapaicore.proto";
import "dline/provider/claude_code.proto";
import "dline/provider/openrouter.proto";
import "dline/provider/openai.proto";
import "dline/provider/ollama.proto";
import "dline/provider/lmstudio.proto";
import "dline/provider/qwen.proto";
import "dline/provider/qwen_code.proto";
import "dline/provider/litellm.proto";
import "dline/provider/moonshot.proto";
import "dline/provider/asksage.proto";
import "dline/provider/cline_provider.proto";
import "dline/provider/zai.proto";
import "dline/provider/oca.proto";
import "dline/provider/aihubmix.proto";
import "dline/provider/minimax.proto";
import "dline/provider/common.proto";
import "dline/provider/fireworks.proto";
import "dline/provider/openai_codex.proto";
import "dline/provider/dify.proto";
import "dline/provider/opencode.proto";

enum ImageGenerationSource {
  IMAGE_GENERATION_SOURCE_UNSPECIFIED = 0;
  IMAGE_GENERATION_SOURCE_GPT_SUBSCRIPTION = 1;
  IMAGE_GENERATION_SOURCE_INDEPENDENT = 2;
  IMAGE_GENERATION_SOURCE_HOSTED = 3;
  IMAGE_GENERATION_SOURCE_GPT_API = 4;

  reserved "IMAGE_GENERATION_SOURCE_CURRENT";
}

/** Common safety and cost limits for image generation through one profile. */
message ImageGenerationProfileSettings {
  optional double task_budget_usd = 1;
  optional int64 request_timeout_ms = 2;
  optional uint32 max_concurrent_requests = 3;
}

/** A configured provider+model combination (ApiProfile). */
message ApiProfile {
  string id = 1;
  string name = 2;
  string provider = 3;
  string api_key = 4;
  optional string base_url = 5;
  string model_id = 6;
  repeated string used_for = 7;
  bool enabled = 8;
  optional ModelInfo model_info = 9;  // user defined model info overwrite

  // Previous display names retained for name-only Task migration after rename.
  repeated string legacy_names = 91;

  // Storage revision of this profile. One-time repairs that rewrite stored data
  // run while this trails the reader's current revision, then bump it. Absent
  // means revision 0, which is what every profile written before the field
  // existed effectively carries.
  optional uint32 schema_version = 96;

  // Web tools routing policy for this provider profile, covering Web Search and
  // Web Fetch. Omitted legacy values resolve to WEB_TOOLS_MODE_AUTO.
  optional dline.provider.WebToolsMode web_tools_mode = 90;
  optional string image_model_id = 92;
  optional ImageGenerationProfileSettings image_generation = 93;
  optional ImageGenerationSource image_source = 94;
  optional string image_profile_id = 95;

  oneof provider_config {
    dline.provider.AnthropicProviderConfig anthropic = 10;
    dline.provider.BedrockProviderConfig bedrock = 11;
    dline.provider.VertexProviderConfig vertex = 12;
    dline.provider.SapAiCoreProviderConfig sapaicore = 13;
    dline.provider.ClaudeCodeProviderConfig claude_code = 14;
    dline.provider.OpenRouterProviderConfig openrouter = 20;
    dline.provider.OpenAiProviderConfig openai = 21;
    dline.provider.OllamaProviderConfig ollama = 22;
    dline.provider.LmStudioProviderConfig lmstudio = 23;
    dline.provider.QwenProviderConfig qwen = 24;
    dline.provider.QwenCodeProviderConfig qwen_code = 25;
    dline.provider.LiteLlmProviderConfig litellm = 26;
    dline.provider.MoonshotProviderConfig moonshot = 27;
    dline.provider.AskSageProviderConfig asksage = 28;
    dline.provider.ClineProviderConfig cline_provider = 29;
    dline.provider.ZAiProviderConfig zai = 30;
    dline.provider.OcaProviderConfig oca = 31;
    dline.provider.AihubmixProviderConfig aihubmix = 32;
    dline.provider.MinimaxProviderConfig minimax = 33;
    // --- New provider configs ---
    dline.provider.BaseProviderConfig deepseek = 34;
    dline.provider.BaseProviderConfig doubao = 35;
    dline.provider.BaseProviderConfig mistral = 36;
    dline.provider.BaseProviderConfig vscode_lm = 37;
    dline.provider.BaseProviderConfig nebius = 38;
    dline.provider.FireworksProviderConfig fireworks = 39;
    dline.provider.BaseProviderConfig xai = 40;
    dline.provider.BaseProviderConfig sambanova = 41;
    dline.provider.BaseProviderConfig cerebras = 42;
    dline.provider.BaseProviderConfig groq = 43;
    dline.provider.BaseProviderConfig huggingface = 44;
    dline.provider.BaseProviderConfig huawei_cloud_maas = 45;
    dline.provider.BaseProviderConfig baseten = 46;
    dline.provider.BaseProviderConfig vercel_ai_gateway = 47;
    dline.provider.BaseProviderConfig together = 48;
    dline.provider.BaseProviderConfig requesty = 49;
    dline.provider.BaseProviderConfig hicap = 50;
    dline.provider.OpenAiCodexProviderConfig openai_codex = 51;
    dline.provider.BaseProviderConfig openai_native = 52;
    dline.provider.BaseProviderConfig gemini = 53;
    dline.provider.BaseProviderConfig nous_research = 54;
    dline.provider.BaseProviderConfig wandb = 55;
    dline.provider.DifyProviderConfig dify = 56;
    dline.provider.OpenCodeProviderConfig opencode = 57;
  }
}

/** Independent image endpoint credentials selected by an API Profile. */
message ImageGenerationProfile {
  string id = 1;
  string name = 2;
  string provider = 3;
  string api_key = 4;
  optional string base_url = 5;
  bool enabled = 6;
  repeated string legacy_names = 7;
}

message ImageGenerationProfilesResponse {
  repeated ImageGenerationProfile profiles = 1;
}

message UpdateImageGenerationProfilesRequest {
  repeated ImageGenerationProfile profiles = 1;
  repeated string clear_api_key_profile_ids = 2;
}

/** Response for getApiProfiles RPC. */
message ApiProfilesResponse {
  repeated ApiProfile profiles = 1;
}

/** Request for updateApiProfiles RPC. */
message UpdateApiProfilesRequest {
  repeated ApiProfile profiles = 1;
  // Profile IDs whose flat API key should be explicitly removed.
  repeated string clear_api_key_profile_ids = 2;
}
