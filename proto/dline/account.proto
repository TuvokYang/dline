syntax = "proto3";

package dline;

import "dline/common.proto";
import "dline/state.proto";

option go_package = "github.com/dline/grpc-go/dline";
option java_multiple_files = true;
option java_package = "bot.dline.proto";

// Service for account-related operations
service AccountService {
  // Handles the user clicking the login link in the UI.
  // Generates a secure nonce for state validation, stores it in secrets,
  // and opens the authentication URL in the external browser.
  rpc accountLoginClicked(EmptyRequest) returns (String);

  // Handles the user clicking the logout button in the UI.
  // Clears API keys and user state.
  rpc accountLogoutClicked(EmptyRequest) returns (Empty);

  // Subscribe to auth status update events (when authentication state changes)
  rpc subscribeToAuthStatusUpdate(EmptyRequest) returns (stream AuthState);

  // Handles authentication state changes from the Firebase context.
  // Updates the user info in global state and returns the updated value.
  rpc authStateChanged(AuthStateChangedRequest) returns (AuthState);

  // Fetches all user credits data
  // (balance, usage transactions, payment transactions)
  rpc getUserCredits(EmptyRequest) returns (UserCreditsData);

  rpc getOrganizationCredits(GetOrganizationCreditsRequest) returns (OrganizationCreditsData);

  // Fetches all user organizations data
  // Returns a list of UserOrganization objects
  rpc getUserOrganizations(EmptyRequest) returns (UserOrganizationsResponse);

  rpc setUserOrganization(UserOrganizationUpdateRequest) returns (Empty);

  rpc openrouterAuthClicked(EmptyRequest) returns (Empty);

  rpc requestyAuthClicked(StringRequest) returns (Empty);

  rpc hicapAuthClicked(EmptyRequest) returns (Empty);

  // Returns a link the webview can use to redirect back to the user's IDE.
  rpc getRedirectUrl(EmptyRequest) returns (String);

  // Returns the shared usage capability for one explicit Profile.
  rpc getProviderUsage(ProviderUsageRequest) returns (AccountUsage);

  // Consumes one provider-owned reset credit through the shared usage capability.
  rpc consumeAccountUsageResetCredit(AccountUsageResetCreditRequest) returns (AccountUsageResetResult);

  // Deprecated compatibility RPC. It no longer infers an active Profile.
  rpc openAiCodexSignIn(EmptyRequest) returns (Empty) {
    option deprecated = true;
  }

  // Starts a browser OAuth flow for one OpenAI Codex Profile.
  rpc startOpenAiCodexSignIn(OpenAiCodexProfileRequest) returns (OpenAiCodexAuthFlow);

  // Returns the current OAuth status for one OpenAI Codex Profile.
  rpc getOpenAiCodexAuthStatus(OpenAiCodexProfileRequest) returns (OpenAiCodexAuthStatusResponse);

  // Returns Profile-scoped ChatGPT Codex quota and reset-credit availability.
  rpc getOpenAiCodexUsage(OpenAiCodexProfileRequest) returns (OpenAiCodexUsageResponse);

  // Consumes one selected rate-limit reset credit after explicit user confirmation.
  rpc consumeOpenAiCodexRateLimitResetCredit(ConsumeOpenAiCodexRateLimitResetCreditRequest) returns (OpenAiCodexRateLimitResetResult);

  // Completes an existing flow from the full localhost callback URI.
  rpc completeOpenAiCodexCallbackUri(OpenAiCodexCallbackUriRequest) returns (OpenAiCodexAuthStatusResponse);

  // Imports a complete OAuth credential JSON object for one OpenAI Codex Profile.
  rpc importOpenAiCodexCredentialJson(OpenAiCodexOAuthJsonRequest) returns (OpenAiCodexAuthStatusResponse);

  // Cancels an existing OAuth flow owned by one OpenAI Codex Profile.
  rpc cancelOpenAiCodexSignIn(OpenAiCodexAuthFlowRequest) returns (Empty);

  // Deprecated compatibility RPC. It no longer infers an active Profile.
  rpc openAiCodexSignOut(EmptyRequest) returns (Empty) {
    option deprecated = true;
  }

  // Signs out one OpenAI Codex Profile and clears only its credential.
  rpc signOutOpenAiCodexProfile(OpenAiCodexProfileRequest) returns (Empty);

  // Starts a subscription OAuth flow for one Claude Code Profile.
  rpc startClaudeCodeSignIn(ClaudeCodeProfileRequest) returns (ClaudeCodeAuthFlow);

  // Returns the current OAuth status for one Claude Code Profile.
  rpc getClaudeCodeAuthStatus(ClaudeCodeProfileRequest) returns (ClaudeCodeAuthStatusResponse);

  // Completes a flow from either a pasted callback URL or a pasted authorization code.
  rpc completeClaudeCodeSignIn(ClaudeCodePastedValueRequest) returns (ClaudeCodeAuthStatusResponse);

  // Cancels an existing OAuth flow owned by one Claude Code Profile.
  rpc cancelClaudeCodeSignIn(ClaudeCodeAuthFlowRequest) returns (Empty);

  // Signs out one Claude Code Profile and clears only its credential.
  rpc signOutClaudeCodeProfile(ClaudeCodeProfileRequest) returns (Empty);

  // Submits a spend limit increase request to the user's org admin.
  // Called when the user hits a SPEND_LIMIT_EXCEEDED (429) error and clicks "Request Increase".
  rpc submitLimitIncreaseRequest(EmptyRequest) returns (SubmitLimitIncreaseResponse);
}

enum OpenAiCodexAuthStatus {
  OPEN_AI_CODEX_AUTH_STATUS_UNSPECIFIED = 0;
  OPEN_AI_CODEX_AUTH_STATUS_MISSING = 1;
  OPEN_AI_CODEX_AUTH_STATUS_MALFORMED = 2;
  OPEN_AI_CODEX_AUTH_STATUS_LEGACY_SHARED = 3;
  OPEN_AI_CODEX_AUTH_STATUS_AUTHENTICATED = 4;
  OPEN_AI_CODEX_AUTH_STATUS_REFRESHABLE_EXPIRED = 5;
  OPEN_AI_CODEX_AUTH_STATUS_REAUTHENTICATION_REQUIRED = 6;
}

enum OpenAiCodexBrowserOpenStatus {
  OPEN_AI_CODEX_BROWSER_OPEN_STATUS_UNSPECIFIED = 0;
  OPEN_AI_CODEX_BROWSER_OPEN_STATUS_OPENED = 1;
  OPEN_AI_CODEX_BROWSER_OPEN_STATUS_FAILED = 2;
}

enum OpenAiCodexFlowStatus {
  OPEN_AI_CODEX_FLOW_STATUS_UNSPECIFIED = 0;
  OPEN_AI_CODEX_FLOW_STATUS_COMPLETED = 1;
  OPEN_AI_CODEX_FLOW_STATUS_CANCELLED = 2;
  OPEN_AI_CODEX_FLOW_STATUS_TIMED_OUT = 3;
  OPEN_AI_CODEX_FLOW_STATUS_FAILED = 4;
}

message OpenAiCodexProfileRequest {
  string profile_id = 1;
}

message OpenAiCodexAuthFlowRequest {
  string profile_id = 1;
  string flow_id = 2;
}

message OpenAiCodexCallbackUriRequest {
  string profile_id = 1;
  string flow_id = 2;
  string callback_uri = 3;
}

message OpenAiCodexOAuthJsonRequest {
  string profile_id = 1;
  string oauth_json = 2;
}

message OpenAiCodexAuthFlow {
  string profile_id = 1;
  string flow_id = 2;
  string authorization_url = 3;
  string redirect_uri = 4;
  int64 expires_at_ms = 5;
  OpenAiCodexBrowserOpenStatus browser_open_status = 6;
}

message OpenAiCodexFlowOutcome {
  string profile_id = 1;
  string flow_id = 2;
  OpenAiCodexFlowStatus status = 3;
  int64 ended_at_ms = 4;
}

message OpenAiCodexAccount {
  string account_id = 1;
  optional string display_name = 2;
  optional string email = 3;
  optional string account_type = 4;
  optional int64 expires_at_ms = 5;
}

message OpenAiCodexAuthStatusResponse {
  string profile_id = 1;
  OpenAiCodexAuthStatus status = 2;
  string flow_id = 3;
  OpenAiCodexAuthFlow active_flow = 4;
  OpenAiCodexFlowOutcome last_flow_outcome = 5;
  OpenAiCodexAccount account = 6;
}

enum ClaudeCodeAuthStatus {
  CLAUDE_CODE_AUTH_STATUS_UNSPECIFIED = 0;
  CLAUDE_CODE_AUTH_STATUS_MISSING = 1;
  CLAUDE_CODE_AUTH_STATUS_MALFORMED = 2;
  CLAUDE_CODE_AUTH_STATUS_AUTHENTICATED = 3;
  CLAUDE_CODE_AUTH_STATUS_REFRESHABLE_EXPIRED = 4;
  CLAUDE_CODE_AUTH_STATUS_UNUSABLE_EXPIRED = 5;
}

message ClaudeCodeProfileRequest {
  string profile_id = 1;
}

message ClaudeCodeAuthFlowRequest {
  string profile_id = 1;
  string flow_id = 2;
}

// One paste field accepts either a callback URL or a bare authorization code.
message ClaudeCodePastedValueRequest {
  string profile_id = 1;
  string flow_id = 2;
  string pasted_value = 3;
}

message ClaudeCodeAuthFlow {
  string profile_id = 1;
  string flow_id = 2;
  string authorization_url = 3;
  optional string manual_authorization_url = 4;
  int64 expires_at_ms = 5;
  OpenAiCodexBrowserOpenStatus browser_open_status = 6;
  // False when no loopback port could be bound, so only the paste path works.
  bool loopback_listening = 7;
}

message ClaudeCodeAccount {
  optional string display_name = 1;
  optional string email = 2;
  optional string organization_name = 3;
  optional int64 expires_at_ms = 4;
}

message ClaudeCodeAuthStatusResponse {
  string profile_id = 1;
  ClaudeCodeAuthStatus status = 2;
  ClaudeCodeAuthFlow active_flow = 3;
  ClaudeCodeAccount account = 4;
}

message ProviderUsageRequest {
  string profile_id = 1;
}

message AccountUsageResetCreditRequest {
  string profile_id = 1;
  string credit_id = 2;
}

message AccountUsageResetResult {
  string profile_id = 1;
  string outcome = 2;
  repeated string quota_types_reset = 3;
  AccountUsage usage = 4;
}

message OpenAiCodexUsageWindow {
  string type = 1;
  string label = 2;
  double used_percent = 3;
  double remaining_percent = 4;
  int64 limit_window_seconds = 5;
  optional int64 reset_at_ms = 6;
}

message OpenAiCodexRateLimitResetCredit {
  string id = 1;
  optional int64 granted_at_ms = 2;
  optional int64 expires_at_ms = 3;
}

message OpenAiCodexUsageResponse {
  string profile_id = 1;
  optional string plan_type = 2;
  repeated OpenAiCodexUsageWindow windows = 3;
  optional double credits_balance = 4;
  uint32 reset_credits_available_count = 5;
  optional bool allowed = 6;
  optional bool limit_reached = 7;
  bool is_available = 8;
  repeated OpenAiCodexRateLimitResetCredit reset_credits = 9;
}

message ConsumeOpenAiCodexRateLimitResetCreditRequest {
  string profile_id = 1;
  string credit_id = 2;
}

enum OpenAiCodexRateLimitResetOutcome {
  OPEN_AI_CODEX_RATE_LIMIT_RESET_OUTCOME_UNSPECIFIED = 0;
  OPEN_AI_CODEX_RATE_LIMIT_RESET_OUTCOME_RESET = 1;
  OPEN_AI_CODEX_RATE_LIMIT_RESET_OUTCOME_NOTHING_TO_RESET = 2;
  OPEN_AI_CODEX_RATE_LIMIT_RESET_OUTCOME_NO_CREDIT = 3;
  OPEN_AI_CODEX_RATE_LIMIT_RESET_OUTCOME_ALREADY_REDEEMED = 4;
}

message OpenAiCodexRateLimitResetResult {
  string profile_id = 1;
  OpenAiCodexRateLimitResetOutcome outcome = 2;
  repeated string windows_reset = 3;
}

message AuthStateChangedRequest {
  Metadata metadata = 1;
  UserInfo user = 2;
}

message AuthState {
  optional UserInfo user = 1;
}

// User's information
message UserInfo {
  string uid = 1;
  optional string display_name = 2;
  optional string email = 3;
  optional string photo_url = 4;
  optional string app_base_url = 5; // Cline app base URL
}

message UserOrganization {
  bool active = 1;
  string member_id = 2;
  string name = 3;
  string organization_id = 4;
  repeated string roles = 5; // ["admin", "member", "owner"]
}

message UserOrganizationsResponse {
  repeated UserOrganization organizations = 1;
}

message UserOrganizationUpdateRequest {
  optional string organization_id = 1;
}

message UserCreditsData {
  UserCreditsBalance balance = 1;
  repeated UsageTransaction usage_transactions = 2;
  repeated PaymentTransaction payment_transactions = 3;
}

message GetOrganizationCreditsRequest {
  string organization_id = 1;
}

message OrganizationCreditsData {
  UserCreditsBalance balance = 1;
  string organization_id = 2;
  repeated OrganizationUsageTransaction usage_transactions = 3;
}

message UserCreditsBalance {
  double current_balance = 1;
}

message UsageTransaction {
  string ai_inference_provider_name = 1;
  string ai_model_name = 2;
  string ai_model_type_name = 3;
  int32 completion_tokens = 4;
  double cost_usd = 5;
  string created_at = 6;
  double credits_used = 7;
  string generation_id = 8;
  string organization_id = 9;
  int32 prompt_tokens = 10;
  int32 total_tokens = 11;
  string user_id = 12;
  string operation = 13;
}

// Response from a spend limit increase request submission
message SubmitLimitIncreaseResponse {
  bool success = 1;
}

message PaymentTransaction {
  string paid_at = 1;
  string creator_id = 2;
  int32 amount_cents = 3;
  double credits = 4;
}

message OrganizationUsageTransaction {
  string ai_inference_provider_name = 1;
  string ai_model_name = 2;
  string ai_model_type_name = 3;
  int32 completion_tokens = 4;
  double cost_usd = 5;
  string created_at = 6;
  double credits_used = 7;
  string generation_id = 8;
  string organization_id = 9;
  int32 prompt_tokens = 10;
  int32 total_tokens = 11;
  string user_id = 12;
  string operation = 13;
}
