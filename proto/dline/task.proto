syntax = "proto3";

package dline;

import "dline/common.proto";
import "dline/state.proto";
import "dline/ui.proto";

option go_package = "github.com/dline/grpc-go/dline";
option java_multiple_files = true;
option java_package = "bot.dline.proto";

service TaskService {
  // Cancels the currently running task
  rpc cancelTask(EmptyRequest) returns (Empty);
  // Cancels the currently running background command
  rpc cancelBackgroundCommand(EmptyRequest) returns (Empty);
  // Clears the current task
  rpc clearTask(EmptyRequest) returns (Empty);
  // Gets the total size of all tasks
  rpc getTotalTasksSize(EmptyRequest) returns (Int64);
  // Checks if a task is locked by another instance (for pre-deletion check)
  rpc checkTaskLock(StringRequest) returns (TaskLockStatus);
  // Deletes multiple tasks with the given IDs, returning per-task results
  rpc deleteTasksWithIds(StringArrayRequest) returns (TaskDeletionResult);
  // Force-release a task lock so the current instance can take over
  rpc forceReleaseTaskLock(StringRequest) returns (Empty);
  // Creates a new task with the given text and optional images
  rpc newTask(NewTaskRequest) returns (String);
  // Shows a task with the specified ID
  rpc showTaskWithId(StringRequest) returns (TaskResponse);
  // Exports a task with the given ID to markdown
  rpc exportTaskWithId(StringRequest) returns (Empty);
  // Toggles the favorite status of a task
  rpc toggleTaskFavorite(TaskFavoriteRequest) returns (Empty);
  // Gets filtered task history
  rpc getTaskHistory(GetTaskHistoryRequest) returns (TaskHistoryArray);
  // Gets task-local API rate history without adding it to ExtensionState
  rpc getTaskRateMetrics(GetTaskRateMetricsRequest) returns (GetTaskRateMetricsResponse);
  // Sends a response to a previous ask operation
  rpc askResponse(AskResponseRequest) returns (Empty);
  // Dispatches a causally identified response to the active task interaction
  rpc dispatchInteraction(DispatchInteractionRequest) returns (DispatchInteractionResponse);
  // Requests a task-local context compaction without consuming the active interaction
  rpc compactTask(CompactTaskRequest) returns (CompactTaskResponse);
  // Records task feedback (thumbs up/down)
  rpc taskFeedback(StringRequest) returns (Empty);
  // Shows task completion changes diff in a view
  rpc taskCompletionViewChanges(Int64Request) returns (Empty);
  // Executes a quick win task with command and title
  rpc executeQuickWin(ExecuteQuickWinRequest) returns (Empty);
  // Deletes all task history
  rpc deleteAllTaskHistory(EmptyRequest) returns (DeleteAllTaskHistoryCount);
  // Explains changes with AI and adds inline comments to the diff view
  rpc explainChanges(ExplainChangesRequest) returns (Empty);
  // Fetches messages for virtual scrolling
  rpc fetchMessage(FetchMessageRequest) returns (FetchMessageResponse);
  // Opens an existing task in a new Editor Tab window
  rpc openTaskInNewWindow(StringRequest) returns (Empty);
  // Spawns a new sub-task from the parent task's context
  rpc spawnTask(SpawnTaskRequest) returns (SpawnTaskResponse);
  // Manually refreshes the frozen system prompt cache for a task
  rpc refreshPrompt(RefreshPromptRequest) returns (RefreshPromptResponse);
  // Streams task-local subagent and command activity without rebuilding ExtensionState
  rpc subscribeToTaskActivities(TaskActivitySubscriptionRequest) returns (stream TaskActivityUpdate);
  // Cancels one or more task-local activities by stable activity id
  rpc cancelTaskActivities(CancelTaskActivitiesRequest) returns (CancelTaskActivitiesResponse);
  // Requests one or more running subagents to stop exploring and complete
  rpc finishTaskActivities(FinishTaskActivitiesRequest) returns (FinishTaskActivitiesResponse);
  // Retries one or more retained retryable subagent activities
  rpc retryTaskActivities(RetryTaskActivitiesRequest) returns (RetryTaskActivitiesResponse);
  // Moves a synchronous foreground command to background tracking
  rpc moveCommandToBackground(MoveCommandToBackgroundRequest) returns (MoveCommandToBackgroundResponse);
  // Applies one user-driven change to the task input queue
  rpc mutateInputQueue(MutateInputQueueRequest) returns (MutateInputQueueResponse);
}

// Request message for creating a new task
message NewTaskRequest {
  Metadata metadata = 1;
  string text = 2;
  repeated string images = 3;
  repeated string files = 4;
  optional Settings task_settings = 5;
}

// Request message for toggling task favorite status
message TaskFavoriteRequest {
  Metadata metadata = 1;
  string task_id = 2;
  bool is_favorited = 3;
}

// Response for task details
message TaskResponse {
  string id = 1;
  string task = 2;
  int64 ts = 3;
  bool is_favorited = 4;
  int64 size = 5;
  double total_cost = 6;
  int32 tokens_in = 7;
  int32 tokens_out = 8;
  int32 cache_writes = 9;
  int32 cache_reads = 10;
  string model_id = 11;
  optional double cache_hit_rate = 12;
  optional string currency = 13;
}

// Request for getting task history with filtering
message GetTaskHistoryRequest {
  Metadata metadata = 1;
  bool favorites_only = 2;
  string search_query = 3;
  string sort_by = 4;
  bool current_workspace_only = 5;
  bool include_completion_status = 6;
  int32 result_limit = 7;
}

// Response for task history
message TaskHistoryArray {
  repeated TaskItem tasks = 1;
  int32 total_count = 2;
}

enum TaskRateMetricsResolution {
  TASK_RATE_METRICS_RESOLUTION_UNSPECIFIED = 0;
  TASK_RATE_METRICS_RESOLUTION_MINUTE = 1;
  TASK_RATE_METRICS_RESOLUTION_HOUR = 2;
  TASK_RATE_METRICS_RESOLUTION_DAY = 3;
  TASK_RATE_METRICS_RESOLUTION_ROUND = 4;
}

enum TaskRateTokenQuality {
  TASK_RATE_TOKEN_QUALITY_ESTIMATED = 0;
  TASK_RATE_TOKEN_QUALITY_MIXED = 1;
  TASK_RATE_TOKEN_QUALITY_EXACT = 2;
}

enum TaskRateRpmBasis {
  TASK_RATE_RPM_BASIS_UNSPECIFIED = 0;
  TASK_RATE_RPM_BASIS_PROVIDER_DURATION = 1;
  TASK_RATE_RPM_BASIS_LEGACY_ACTIVE_SECONDS = 2;
  TASK_RATE_RPM_BASIS_UNAVAILABLE = 3;
  TASK_RATE_RPM_BASIS_EXECUTION_DURATION = 4;
}

enum TaskRateUsageQuality {
  TASK_RATE_USAGE_QUALITY_UNSPECIFIED = 0;
  TASK_RATE_USAGE_QUALITY_NONE = 1;
  TASK_RATE_USAGE_QUALITY_ESTIMATED = 2;
  TASK_RATE_USAGE_QUALITY_EXACT = 3;
  TASK_RATE_USAGE_QUALITY_MIXED = 4;
  TASK_RATE_USAGE_QUALITY_LEGACY = 5;
}

enum TaskRateRoundStatus {
  TASK_RATE_ROUND_STATUS_UNSPECIFIED = 0;
  TASK_RATE_ROUND_STATUS_COMPLETED = 1;
  TASK_RATE_ROUND_STATUS_FAILED = 2;
  TASK_RATE_ROUND_STATUS_CANCELLED = 3;
  TASK_RATE_ROUND_STATUS_ABORTED = 4;
}

message GetTaskRateMetricsRequest {
  string task_id = 1;
  TaskRateMetricsResolution resolution = 2;
  int64 start_ms = 3;
  int64 end_ms = 4;
  int32 max_points = 5;
  // Identifies this opening, not the durable Task or its runtime revision.
  string task_instance_id = 6;
}

message TaskRateMetricPoint {
  int64 bucket_start_ms = 1;
  int64 bucket_end_ms = 2;
  optional int32 active_seconds = 3;
  optional int32 request_count = 4;
  optional int64 token_count = 5;
  optional int32 requests_per_minute = 6;
  optional int64 tokens_per_minute = 7;
  optional TaskRateTokenQuality token_quality = 8;
  bool provisional = 9;
  optional int64 input_tokens = 10;
  optional int64 output_tokens = 11;
  optional int64 thoughts_tokens = 12;
  optional int64 cache_write_tokens = 13;
  optional int64 cache_read_tokens = 14;
  optional double cache_hit_rate = 15;
  bool cache_usage_available = 16;
  bool usage_available = 17;
  optional int64 provider_duration_ms = 18;
  int32 provider_round_count = 19;
  int32 completed_round_count = 20;
  int32 failed_round_count = 21;
  int32 cancelled_round_count = 22;
  int32 aborted_round_count = 23;
  TaskRateRpmBasis rpm_basis = 24;
  TaskRateUsageQuality usage_quality = 25;
  optional TaskRateRoundStatus status = 26;
  optional string round_id = 27;
  optional string logical_request_id = 28;
  optional int32 api_index = 29;
  optional int32 task_attempt = 30;
  optional int32 provider_attempt = 31;
  optional int64 started_at_ms = 32;
  optional int64 completed_at_ms = 33;
  optional double total_cost = 34;
  optional string currency = 35;
  optional int64 execution_duration_ms = 36;
  int32 execution_count = 37;
  int32 completed_execution_count = 38;
  int32 failed_execution_count = 39;
  int32 cancelled_execution_count = 40;
  int32 aborted_execution_count = 41;
}

message GetTaskRateMetricsResponse {
  repeated TaskRateMetricPoint points = 1;
  bool degraded = 2;
  bool truncated = 3;
  optional int64 retention_start_ms = 4;
  string task_id = 5;
  string task_instance_id = 6;
}

// Task item details for history list
message TaskItem {
  string id = 1;
  string task = 2;
  int64 ts = 3;
  bool is_favorited = 4;
  int64 size = 5;
  double total_cost = 6;
  int32 tokens_in = 7;
  int32 tokens_out = 8;
  int32 cache_writes = 9;
  int32 cache_reads = 10;
  string model_id = 11;
  optional double cache_hit_rate = 12;
  optional string currency = 13;
  optional bool is_completed = 14;
  // Runtime revision that produced the completion projection. Present only for
  // a canonical projection; a bare is_completed without it is not authoritative.
  optional int64 completion_state_revision = 15;
}

// Request for ask response operation
message AskResponseRequest {
  Metadata metadata = 1;
  string response_type = 2;
  string text = 3;
  repeated string images = 4;
  repeated string files = 5;
}

// Draft content submitted with an interaction response
message InteractionDraft {
  string text = 1;
  repeated string images = 2;
  repeated string files = 3;
}

// Selection values submitted with a selection-aware interaction response
message InteractionSelection {
  repeated string values = 1;
}

// Causally identified response to the active task interaction
message DispatchInteractionRequest {
  string task_id = 1;
  string turn_id = 2;
  string interaction_id = 3;
  string action_id = 4;
  int64 state_revision = 5;
  optional InteractionDraft draft = 6;
  optional InteractionSelection selection = 7;
  string task_instance_id = 8;
}

// Expected result of dispatching an interaction response
message DispatchInteractionResponse {
  bool accepted = 1;
  string result = 2;
}

// Request for task-local context compaction
message CompactTaskRequest {
  string task_id = 1;
  int64 state_revision = 2;
  bool force_truncate = 3;
}

// Expected result of requesting task-local context compaction
message CompactTaskResponse {
  bool accepted = 1;
  string result = 2;
}

// Composer draft carried by an enqueue or edit-commit operation
message InputQueueDraft {
  string text = 1;
  repeated string images = 2;
  repeated string files = 3;
  optional string active_quote = 4;
}

// Adds a draft to the back of the queue as a queued entry
message EnqueueInput {
  InputQueueDraft draft = 1;
}

// Flips one entry between queued and steering without delivering it
message ToggleInputMode {
  string entry_id = 1;
}

// Moves one entry to an explicit position, which is also its delivery order
message ReorderInput {
  string entry_id = 1;
  int32 target_index = 2;
}

// Holds one entry back from delivery while the user edits it in the composer
message BeginInputEdit {
  string entry_id = 1;
}

// Replaces the content of an edited entry, keeping its position and mode
message CommitInputEdit {
  string entry_id = 1;
  InputQueueDraft draft = 2;
}

// Releases the edit gate without changing the entry
message CancelInputEdit {
  string entry_id = 1;
}

// Drops one entry; this is the only way an entry leaves the queue unsent
message RemoveInput {
  string entry_id = 1;
}

// One user-driven change to the task input queue
message MutateInputQueueRequest {
  string task_id = 1;
  oneof operation {
    EnqueueInput enqueue = 2;
    ToggleInputMode toggle_mode = 3;
    ReorderInput reorder = 4;
    BeginInputEdit begin_edit = 5;
    CommitInputEdit commit_edit = 6;
    CancelInputEdit cancel_edit = 7;
    RemoveInput remove = 8;
  }
}

// Outcome of an input queue mutation
message MutateInputQueueResponse {
  bool accepted = 1;
  string result = 2;
}

// Request for executing a quick win task
message ExecuteQuickWinRequest {
  Metadata metadata = 1;
  string command = 2;
  string title = 3;
}

// Results returned when deleting all task history
message DeleteAllTaskHistoryCount {
  int32 tasks_deleted = 1;
}

// Request for explaining changes with AI
message ExplainChangesRequest {
  Metadata metadata = 1;
  // Timestamp of the completion message to explain changes for
  int64 message_ts = 2;
}

// Request for fetching messages (for virtual scrolling)
message FetchMessageRequest {
  Metadata metadata = 1;
  // Absolute index in the full message list (excluding task message)
  int64 reference_index = 2;
  // Number of messages to fetch starting from reference_index
  int32 count = 3;
  string task_id = 4;
  string task_instance_id = 5;
}

// Response for fetchMessage
message FetchMessageResponse {
  repeated ClineMessage messages = 1;
  // Total number of messages (excluding task) for virtuoso totalCount
  int32 total_count = 2;
  // Absolute index of the first message in the returned messages array
  int32 start_index = 3;
  string task_id = 4;
  string task_instance_id = 5;
}

// Request message for spawning a new sub-task
message SpawnTaskRequest {
  string task = 1;
  string context = 2;
  string parent_task_id = 3;
}

// Response for spawning a new sub-task
message SpawnTaskResponse {
  string task_id = 1;
}

// Request for manually refreshing system prompt cache
message RefreshPromptRequest {
  string task_id = 1;
}

// Response for manual system prompt cache refresh
message RefreshPromptResponse {
  bool success = 1;
}

message TaskActivitySubscriptionRequest {
  string task_id = 1;
  string task_instance_id = 2;
}

message CancelTaskActivitiesRequest {
  string task_id = 1;
  repeated string activity_ids = 2;
  string task_instance_id = 3;
}

message CancelTaskActivitiesResponse {
  repeated string cancelled_activity_ids = 1;
}

message FinishTaskActivitiesRequest {
  string task_id = 1;
  repeated string activity_ids = 2;
  string task_instance_id = 3;
}

message FinishTaskActivitiesResponse {
  repeated string finished_activity_ids = 1;
}

message RetryTaskActivitiesRequest {
  string task_id = 1;
  repeated string activity_ids = 2;
  string task_instance_id = 3;
}

message RetryTaskActivitiesResponse {
  repeated string retried_activity_ids = 1;
}

message MoveCommandToBackgroundRequest {
  string task_id = 1;
  string activity_id = 2;
  string task_instance_id = 3;
}

message MoveCommandToBackgroundResponse {
  bool moved = 1;
}

message TaskActivityMetrics {
  int32 tool_calls = 1;
  int64 input_tokens = 2;
  int64 output_tokens = 3;
  double total_cost = 4;
  string currency = 5;
  int64 context_tokens = 6;
  int64 context_window = 7;
  int64 line_count = 8;
  int64 cache_write_tokens = 9;
  int64 cache_read_tokens = 10;
  double cache_hit_rate = 11;
}

message TaskActivityRuntimeConfig {
  optional string profile_name = 1;
  string provider_id = 2;
  string model_id = 3;
  optional string api_format = 4;
  optional bool thinking_enabled = 5;
  optional string reasoning_effort = 6;
  optional int64 thinking_budget_tokens = 7;
}

message TaskActivityEvent {
  int64 sequence = 1;
  int64 timestamp = 2;
  string kind = 3;
  optional string phase = 4;
  optional string text = 5;
  optional string tool_call_id = 6;
  optional string tool_name = 7;
  optional string tool_status = 8;
  optional string summary = 9;
  optional int64 duration_ms = 10;
  optional string error = 11;
  optional string status = 12;
  optional TaskActivityMetrics metrics = 13;
  optional int32 retry_attempt = 14;
  optional int32 max_retries = 15;
  optional int64 delay_ms = 16;
  optional int64 cumulative_delay_ms = 17;
  optional int32 attempt = 18;
}

message TaskActivity {
  string activity_id = 1;
  string task_id = 2;
  string kind = 3;
  string execution_mode = 4;
  string status = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
  optional int64 finished_at = 8;
  string title = 9;
  optional string detail = 10;
  optional string latest_event = 11;
  optional string output = 12;
  optional string result = 13;
  optional string error = 14;
  optional string parent_activity_id = 15;
  optional TaskActivityMetrics metrics = 16;
  optional string log_path = 17;
  bool cancellable = 18;
  int32 schema_version = 19;
  repeated TaskActivityEvent events = 20;
  optional int32 timeout_seconds = 21;
  bool finishable = 22;
  bool retryable = 23;
  optional TaskActivityRuntimeConfig runtime = 24;
  optional int32 current_attempt = 25;
  optional string retry_unavailable_reason = 26;
}

message TaskActivityUpdate {
  int64 sequence = 1;
  bool snapshot = 2;
  repeated TaskActivity activities = 3;
  string task_id = 4;
  string task_instance_id = 5;
}

// Status of a task folder lock
message TaskLockStatus {
  bool is_locked = 1;       // Whether the task is currently locked
  string locked_by = 2;     // Instance address that holds the lock
  int64 locked_at = 3;      // Timestamp when lock was acquired (ms)
  bool is_stale = 4;        // Whether the lock has exceeded its TTL
}

// Result of a batch task deletion operation
message TaskDeletionResult {
  int32 total_requested = 1;   // Number of tasks requested for deletion
  int32 deleted = 2;           // Number of tasks successfully deleted
  int32 failed = 3;            // Number of tasks that failed to delete
  int32 skipped_locked = 4;    // Number of tasks skipped due to active locks
  repeated string failed_ids = 5;   // IDs of tasks that failed
  repeated string locked_ids = 6;   // IDs of tasks skipped due to locks
}
