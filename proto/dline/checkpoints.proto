syntax = "proto3";

package dline;

import "dline/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/dline/grpc-go/dline";
option java_multiple_files = true;
option java_package = "bot.dline.proto";

service CheckpointsService {
  rpc checkpointDiff(CheckpointRestoreRequest) returns (Empty);
  rpc checkpointRestore(CheckpointRestoreRequest) returns (Empty);
  rpc retryCheckpointInitialization(EmptyRequest) returns (Boolean);
  rpc subscribeToCheckpoints(CheckpointSubscriptionRequest) returns (stream CheckpointEvent);
  rpc getCwdHash(StringArrayRequest) returns (PathHashMap);
}

message CheckpointRestoreRequest {
  Metadata metadata = 1;
  int64 number = 2;
  string restore_type = 3;
  optional int64 offset = 4;
  optional string edited_text = 5;
  optional string compaction_operation_id = 6;
  optional string compaction_checkpoint_id = 7;
  optional string compaction_expected_head_checkpoint_id = 8;
  optional int32 compaction_expected_chain_revision = 9;
  string task_id = 10;
  string task_instance_id = 11;
  int64 checkpoint_row_ts = 12;
}

message CheckpointSubscriptionRequest {
  string cwd_hash = 1;
}

message CheckpointEvent {
  enum OperationType {
    CHECKPOINT_INIT = 0;
    CHECKPOINT_COMMIT = 1;
    CHECKPOINT_RESTORE = 2;
  }

  OperationType operation = 1;
  string cwd_hash = 2;
  bool is_active = 3;
  google.protobuf.Timestamp timestamp = 4;
  optional string task_id = 5;
  optional string commit_hash = 6;
}

message PathHashMap {
  map<string, string> path_hash = 1;
}
