syntax = "proto3";

package dline.models;

option go_package = "github.com/dline/grpc-go/dline/models";

/** API protocols supported by a model or selected by a provider profile. */
enum ApiFormat {
  ANTHROPIC_CHAT = 0;
  GEMINI_CHAT = 1;
  OPENAI_CHAT = 2;
  R1_CHAT = 3;
  OPENAI_RESPONSES = 4;
  OPENAI_RESPONSES_WEBSOCKET_MODE = 5;
}

/** Thinking configuration for models that support thinking/reasoning. */
message ThinkingConfig {
  optional bool supported = 1;
  optional string mode = 2;
  optional int64 max_budget = 3;
  repeated string effort_levels = 4;
}

/** Context window tier for models with selectable context windows. */
message ContextWindowTier {
  string id = 1;
  uint64 context_window = 2;
  optional string label = 3;
  optional string api_model_suffix = 4;
}

/** Provider-hosted tools that execute outside Dline's local ToolExecutor. */
enum ServerTool {
  SERVER_TOOL_UNSPECIFIED = 0;
  WEB_SEARCH = 1;
  // Provider-run sandbox. Anthropic's newer web search versions filter results
  // from inside this sandbox, so declaring it also selects the web search version.
  CODE_EXECUTION = 2;
  IMAGE_GENERATION = 3;
  // Provider-run page fetch. Routed by the same Web Tools mode as WEB_SEARCH;
  // while hosted, it replaces the local web_fetch tool of the same name.
  WEB_FETCH = 4;
}

/** Model capability flags and limits. */
message ModelCapabilities {
  optional bool supports_images = 1;
  optional bool supports_prompt_cache = 2;
  optional bool supports_reasoning = 3;
  optional bool supports_global_endpoint = 4;
  optional uint32 max_tokens = 5;
  optional uint64 context_window = 6;
  optional ThinkingConfig thinking = 7;
  optional bool supports_streaming = 8;
  optional bool supports_tools = 9; // Supports API-native function/tool calling.
  optional double temperature = 10;
  repeated ContextWindowTier context_window_tiers = 11;
  repeated ServerTool tools = 12;
  // Whether the model can consume screenshots and operate browser_action.
  // Omitted legacy metadata falls back to supports_images.
  optional bool supports_browser_action = 13;
  // Whether the model accepts a forced tool choice such as Anthropic
  // `tool_choice: any`. Models that reject it fail the whole request rather
  // than degrading to an automatic choice. Omitted metadata is inferred from
  // the declared thinking mode.
  optional bool supports_forced_tool_use = 14;
}

/** Pricing tier for context-window-based tiered models. */
message PricingTier {
  uint64 context_window = 1;
  optional double input_price = 2;
  optional double output_price = 3;
  optional double cache_writes_price = 4;
  optional double cache_reads_price = 5;
}

/** Thinking output price tier. */
message ThinkingOutputPriceTier {
  uint64 token_limit = 1;
  double price = 2;
}

/** Per-model pricing information. */
message ModelPricing {
  optional double input_price = 1;
  optional double output_price = 2;
  optional double cache_writes_price = 3;
  optional double cache_reads_price = 4;
  optional string currency = 5;
  repeated PricingTier tiers = 6;
  optional double thinking_output_price = 7;
  repeated ThinkingOutputPriceTier thinking_output_price_tiers = 8;
}

/** Capabilities for a dedicated image generation model. */
message ImageGenerationCapabilities {
  optional bool supports_generation = 1;
  optional bool supports_editing = 2;
  optional bool supports_mask = 3;
  optional bool supports_reference_images = 4;
  optional bool supports_transparent_background = 5;
  optional uint32 max_images = 6;
}

/** Per-image pricing metadata for dedicated image generation models. */
message ImagePricing {
  optional double price_per_image = 1;
  optional string currency = 2;
}
