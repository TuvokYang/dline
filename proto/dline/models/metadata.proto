syntax = "proto3";

package dline.models;

option go_package = "github.com/dline/grpc-go/dline/models";

/** API protocols supported by a model or selected by a provider profile. */
enum ApiFormat {
  ANTHROPIC_CHAT = 0;
  GEMINI_CHAT = 1;
  OPENAI_CHAT = 2;
  R1_CHAT = 3;
  OPENAI_RESPONSES = 4;
  OPENAI_RESPONSES_WEBSOCKET_MODE = 5;
}

/** Thinking configuration for models that support thinking/reasoning. */
message ThinkingConfig {
  optional bool supported = 1;
  optional string mode = 2;
  optional int64 max_budget = 3;
  repeated string effort_levels = 4;
  // Declares automatic activation when no Profile preference is supplied.
  // Absence does not authorize a model-name or provider-name inference.
  optional bool default_enabled = 5;
  // Only explicit false declares thinking mandatory; omission keeps normal compatibility.
  optional bool can_disable = 6;
  // Default effort declared by the model metadata, not guessed by a consumer.
  optional string default_effort = 7;
  // Lower bound for positive thinking budgets. Absence remains unknown.
  // A zero bound does not authorize disabling thinking; can_disable owns that policy.
  optional int64 min_budget = 8;
}

/** Context window tier for models with selectable context windows. */
message ContextWindowTier {
  string id = 1;
  uint64 context_window = 2;
  optional string label = 3;
  optional string api_model_suffix = 4;
}

/** Provider-hosted tools that execute outside Dline's local ToolExecutor. */
enum ServerTool {
  SERVER_TOOL_UNSPECIFIED = 0;
  WEB_SEARCH = 1;
  // Provider-run sandbox. Anthropic's newer web search versions filter results
  // from inside this sandbox, so declaring it also selects the web search version.
  CODE_EXECUTION = 2;
  IMAGE_GENERATION = 3;
  // Provider-run page fetch. Routed by the same Web Tools mode as WEB_SEARCH;
  // while hosted, it replaces the local web_fetch tool of the same name.
  WEB_FETCH = 4;
}

/** Model capability flags and limits. */
message ModelCapabilities {
  optional bool supports_images = 1;
  optional bool supports_prompt_cache = 2;
  optional bool supports_reasoning = 3;
  optional bool supports_global_endpoint = 4;
  optional uint32 max_tokens = 5;
  optional uint64 context_window = 6;
  optional ThinkingConfig thinking = 7;
  optional bool supports_streaming = 8;
  optional bool supports_tools = 9; // Supports API-native function/tool calling.
  optional double temperature = 10;
  repeated ContextWindowTier context_window_tiers = 11;
  repeated ServerTool tools = 12;
  // Whether the model can consume screenshots and operate browser_action.
  // Omitted legacy metadata falls back to supports_images.
  optional bool supports_browser_action = 13;
  // Whether the model accepts a forced tool choice such as Anthropic
  // `tool_choice: any`. Models that reject it fail the whole request rather
  // than degrading to an automatic choice. Omitted metadata keeps the normal
  // provider wire default; consumers must not infer support from model names.
  optional bool supports_forced_tool_use = 14;
  // Media types (MIME) the model reads natively as user input, such as
  // "image/png" or "application/pdf". Empty means undeclared: consumers derive
  // the legacy set from supports_images through the shared input media resolver
  // and must not infer support from provider or model names.
  repeated string input_media_types = 15;
}

/** One complete price set. Every applied unit price comes from exactly one of these. */
message PriceSet {
  optional double input_price = 1;
  optional double output_price = 2;
  optional double cache_write_price = 3;
  optional double cache_read_price = 4;
  /** Billed instead of output_price while the model is in thinking mode. */
  optional double thinking_output_price = 5;
}

/** One price for every request. */
message FlatPricing {
  PriceSet prices = 1;
}

/** One price band selected by the request's total input tokens. */
message ContextWindowBand {
  /** Inclusive upper bound in tokens. The last band omits it and is unbounded. */
  optional uint64 max_input_tokens = 1;
  PriceSet prices = 2;
}

/** Price bands ordered by ascending input-token usage. */
message ContextWindowPricing {
  repeated ContextWindowBand bands = 1;
}

/**
 * A local-time interval that bills at its own rate.
 *
 * Windows inside one schedule never overlap, so an instant falls into at most
 * one of them and a request's price cannot depend on the order they are listed
 * in. Every instant no window covers bills at the schedule's default rate.
 */
message PricingTimeWindow {
  /** Minutes from local midnight, inclusive. */
  uint32 start_minute = 1;
  /** Minutes from local midnight, exclusive. 1440 is the end of the day. */
  uint32 end_minute = 2;
  /** Rate billed inside this window. Exactly one shape applies. */
  oneof rate {
    PriceSet prices = 3;
    ContextWindowPricing bands = 4;
  }
}

/** Which local days a schedule evaluates against. */
enum PricingDayRule {
  PRICING_DAY_RULE_UNSPECIFIED = 0;
  PRICING_DAY_RULE_WEEKDAYS = 1;
  PRICING_DAY_RULE_ALL_DAYS = 2;
}

/**
 * Which local days the windows of a schedule are evaluated against.
 *
 * The seller publishes one offset, not a timezone name, so this carries the
 * offset directly instead of pulling in a timezone database.
 */
message PricingSchedule {
  /** Seller offset in minutes east of UTC. Windows are meaningless without it. */
  int32 timezone_offset_minutes = 1;
  // The windows moved to TimeOfDayPricing.time_windows, which carries their
  // rates. Reusing this number would read window bounds as window prices.
  reserved 2;
  reserved "peak_windows";
  PricingDayRule day_rule = 3;
  /** Whether public holidays bill at the default rate for the whole day. */
  bool default_on_public_holidays = 4;
  /** Calendar identifier resolved locally, such as "CN". Empty disables the rule. */
  string holiday_calendar = 5;
}

/**
 * Price chosen by when the request started, then by input tokens.
 *
 * The schedule splits the local day into a default rate and a set of
 * non-overlapping windows that each carry their own rate. Time is the outer
 * dimension because the seller decides which rate applies once per request,
 * before the token band narrows the price inside that rate.
 *
 * A seller that publishes one discounted period expresses it as one window plus
 * the default; one that publishes two peak periods publishes two windows over
 * the same default. Both DeepSeek's daily peak periods and the OpenCode Go
 * gateway therefore use one shape instead of a fixed two-rate split.
 */
message TimeOfDayPricing {
  PricingSchedule schedule = 1;
  // Retired: peak/off-peak was a fixed two-rate split that could not describe
  // more than one window or give a window its own token bands.
  reserved 2, 3, 4, 5;
  reserved "peak_prices", "off_peak_prices", "peak_bands", "off_peak_bands";
  /** Rate for every instant no window covers. Exactly one shape applies. */
  oneof default_rate {
    PriceSet default_prices = 6;
    ContextWindowPricing default_bands = 7;
  }
  /** Non-overlapping local-time intervals, each carrying its own rate. */
  repeated PricingTimeWindow time_windows = 8;
}

/** How a model's price is chosen. Exactly one strategy applies. */
message PricingStrategy {
  oneof kind {
    FlatPricing flat = 1;
    ContextWindowPricing context_window = 2;
    TimeOfDayPricing time_of_day = 3;
  }
}

/** Legacy envelope, retained only to read previously stored prices. */
message MeteredPricing {
  option deprecated = true;
  string currency = 1;
  PricingStrategy strategy = 2;
}

/** Legacy account-mode marker without a numeric model price. Read compatibility only. */
message SubscriptionPricing {
  option deprecated = true;
  reserved 1;
}

/** Legacy account-mode marker without a currency or rate. Read compatibility only. */
message FreePricing {
  option deprecated = true;
  reserved 1;
}

/**
 * One model price declaration, independent of account payment or quota mode.
 *
 * Currency and strategy are the only fields written by current producers.
 * Deprecated envelopes are consumed once at read boundaries and never written back.
 * An absent price remains unknown; a published zero is represented by zero rates.
 */
message ModelPricing {
  optional string currency = 12;
  optional PricingStrategy strategy = 13;

  // Decode-only compatibility. Never reuse these numbers for canonical fields.
  oneof legacy_mode {
    MeteredPricing metered = 9 [deprecated = true];
    SubscriptionPricing subscription = 10 [deprecated = true];
    FreePricing free = 11 [deprecated = true];
  }
  // Former flat price and tier fields. Kept reserved so no later field reuses
  // their numbers with a different meaning.
  reserved 1, 2, 3, 4, 5, 6, 7, 8;
}

/** Capabilities for a dedicated image generation model. */
message ImageGenerationCapabilities {
  optional bool supports_generation = 1;
  optional bool supports_editing = 2;
  optional bool supports_mask = 3;
  optional bool supports_reference_images = 4;
  optional bool supports_transparent_background = 5;
  optional uint32 max_images = 6;
}

/** Per-image pricing metadata for dedicated image generation models. */
message ImagePricing {
  optional double price_per_image = 1;
  optional string currency = 2;
}
