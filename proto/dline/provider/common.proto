syntax = "proto3";

package dline.provider;

import "dline/models/metadata.proto";

message ReasoningConfig {
  optional bool enable_thinking = 1;
  optional string effort = 2;
  optional int32 thinking_budget = 3;
  // How reasoning content is returned by providers that expose the choice.
  // Unset means the field is omitted from the request and the provider default applies.
  optional string display = 4;
}

// Per-profile policy for choosing between Dline's local web tool executors
// and provider-hosted server tools. Governs Web Search and Web Fetch together.
enum WebToolsMode {
  WEB_TOOLS_MODE_AUTO = 0;
  WEB_TOOLS_MODE_FORCE_LOCAL = 1;
  WEB_TOOLS_MODE_FORCE_OFF = 2;
  WEB_TOOLS_MODE_FORCE_REMOTE = 3;
}

// Claude Code client identity declared to Anthropic upstream.
//
// The anthropic provider uses this to opt into the billing attribution block
// only. The claude-code provider additionally derives its beta set and
// fingerprint headers from the same configuration, so both providers read one
// contract instead of maintaining parallel toggles.
message ClaudeCodeIdentityConfig {
  // When false the request must stay byte-identical to a request built without
  // this feature.
  bool enabled = 1;
  // Pins the declared client version. Empty resolves it from the registry and
  // falls back to the maintained floor.
  optional string client_version_override = 2;
  // Overrides the declared entrypoint. Empty uses the default.
  optional string entrypoint_override = 3;
}

message BaseProviderConfig {
  ReasoningConfig reasoning = 1;
  bool custom_model_enabled = 2;
  dline.models.ModelCapabilities capabilities = 3;
  dline.models.ModelPricing pricing = 4;
  optional bool enable_long_context = 5;
  optional bool pricing_tiers_enabled = 6;
  // OpenAI request processing tier. Used only by OpenAI-native profiles.
  optional string service_tier = 7;
  // Provider request protocol selected for this profile.
  optional dline.models.ApiFormat api_format = 8;
  // Hosted server tools the user turned off for this profile. The model's own
  // capability declaration lives in the registry; this list only subtracts from
  // it, so an absent list means "follow whatever the model declares".
  repeated dline.models.ServerTool disabled_server_tools = 9;
}
